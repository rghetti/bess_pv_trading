  backed_delivery:
    battery: soc_box
    prices: [100.0]
    pv_ac_mw: [0.0]
    initial_energy_mwh: 0.5
    terminal_target_mwh: null
    imbalance_penalty_eur_per_mwh: 0.0
    planned_delivery_balance_resolution_minutes: 60
    degradation: {model: throughput, cost_eur_per_mwh_throughput: 20.0}
    expected:
      charge_mw: [0.0]
      discharge_mw: [0.388]
      energy_mwh: [0.5, 0.1]
      objective_eur: 31.04
