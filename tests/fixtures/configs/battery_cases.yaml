full_replay:
  first_interval: 35
  stop_interval: 50
  delayed_publication_auction: IDA3
  publication_delay_minutes: 7
  actual_imbalance_price_eur_per_mwh: 100.0
  rolling_pv:
    availability_lag_hours: 4
    factors_by_auction: {DA: 1.0, IDA1: 1.05, IDA2: 1.1, IDA3: 1.15}
  policies:
    - {name: four_auctions_terminal, physical_refresh: false, terminal: configured, actual_settlement: true}
    - {name: four_auctions_free_terminal, physical_refresh: false, terminal: free}
    - {name: physical_refresh_terminal, physical_refresh: true, terminal: configured}
    - {name: four_auctions_no_planned_imbalances, physical_refresh: false, terminal: free, optimize_imbalances: false}
    - {name: four_auctions_grid_feedback, physical_refresh: false, terminal: free, optimize_imbalances: false, dispatch_policy: track_committed_grid, realized_pv_scale: 1.5}
    - {name: depleted_feedback_settles_locked_prefix, physical_refresh: false, terminal: free, optimize_imbalances: false, dispatch_policy: track_committed_grid, realized_pv_scale: 0.5, locked_prefix_has_imbalances: true}
    - {name: rolling_forecasts_four_auctions, physical_refresh: false, terminal: free, rolling_forecast: true}
    - name: hourly_da_quarter_hour_ida_four_auctions
      physical_refresh: false
      terminal: free
      strategy: oracle
      optimize_imbalances: false
      delivery_day: '2025-01-01'
      decision_resolution_minutes: 15
      native_interval_minutes_by_auction: {DA: 60, IDA1: 15, IDA2: 15, IDA3: 15}
    - name: sequential_hourly_da_quarter_hour_ida_four_auctions
      physical_refresh: false
      terminal: free
      strategy: oracle
      auction_planning_mode: current_auction_only
      optimize_imbalances: false
      delivery_day: '2025-01-01'
      decision_resolution_minutes: 15
      native_interval_minutes_by_auction: {DA: 60, IDA1: 15, IDA2: 15, IDA3: 15}

