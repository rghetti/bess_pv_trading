  reference_hourly_case: hourly_pv_profile
  settlement_price_cases: [10000.0, -10000.0]
  imbalance_variables_per_interval: 3
  unbacked_commitment_mwh: 1.0
  invalid_boolean_values: ['false', 0, null]
  strict_hourly_expected:
    grid_mw: [0.0, 0.0, 0.0, 0.0]
    curtailment_mw: [0.0, 1.0, 0.0, 1.0]
    objective_eur: 0.0

