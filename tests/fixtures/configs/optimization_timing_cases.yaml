include: ../../../configs/standard.yaml
# Study-specific reporting settings no longer belong in the shared defaults.
participation_study:
  output_root: outputs/test_timing
  run_id: timing_report
timing_cases:
  solves:
    - {category: replay, auction: DA, status: optimal, runtime_seconds: 1.0, solve_seconds: 1.2, build_seconds: 0.4}
    - {category: replay, auction: IDA3, status: infeasible, runtime_seconds: 3.0, solve_seconds: 3.2, build_seconds: 0.5}
    - {category: perfect_pv_counterfactual, status: optimal, runtime_seconds: 8.0, solve_seconds: 8.2, build_seconds: 0.6}
  profiles: [DA, Sequential]
  days: ['2025-01-01', '2025-01-02']
  experiments:
    - {profile_index: 0, day_index: 0, replay: [1.0, 3.0], benchmark: 10.0}
    - {profile_index: 0, day_index: 1, replay: [4.0], benchmark: 20.0}
    - {profile_index: 1, day_index: 0, replay: [2.0, 6.0], benchmark: 12.0}
  mode_runtimes:
    integrated: [1.0, 3.0]
    current_auction_only: [2.0, 6.0]
  retry:
    statuses: [4, 3]
    runtimes: [1.5, 2.5]
    build_seconds: 0.5

gme_oracle_experiment:
  study_id: null
  delivery_day: null
  timezone: Europe/Rome
  price_database: data/api/market.duckdb
  provider: gme
  zone: NORD
  auction_datasets:
    DA:
      dataset: day_ahead_prices
      native_interval_minutes: null
    IDA1:
      dataset: ida1_prices
      native_interval_minutes: 15
    IDA2:
      dataset: ida2_prices
      native_interval_minutes: 15
    IDA3:
      dataset: ida3_prices
      native_interval_minutes: 15
  missing_auction_policy: skip_if_no_products_fail_if_partial
  price_information: perfect_foresight_actual_clearing_curves
  auction_planning_mode: integrated
  decision_resolution_minutes: 15
  price_display_resolution_minutes: 15
  participating_auctions: null
