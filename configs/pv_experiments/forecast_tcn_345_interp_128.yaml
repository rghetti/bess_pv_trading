# 128-trial TCN search with within-vintage weather interpolation and no missingness channels.
# Fixed 2025 train / Jan-Apr 2026 validation / May-Aug 2026 reported test, farm 345 only.
include: ../standard.yaml
pv_forecast_search:
  farm_ids:
  - 345
  include_national_holiday: true
  excluded_features: []
  missing_weather_interpolation: linear_per_view
  include_missing_indicators: false
  source_root: outputs/pv_neural_tuning/neural_hpo_2025_to_2026_08_42cpu
  output_root: outputs/pv_forecast_search
  run_id: tcn_interp_no_missing_channels_345_128_trials
  resume: true
  workers: 42
  reserved_cpu_cores: 6
  seed: 97231
  feature_sets:
  - core
  baseline_ridge_alpha: 1.0
  statistical_trials_per_family: 0
  statistical_spaces: null
  neural_architectures:
  - direct_tcn
  - residual_tcn
  neural_trials_per_architecture: 64
  neural_space:
    kernel_size:
    - 3
    width:
    - 16
    - 32
    - 48
    - 64
    - 96
    - 128
    depth:
    - 1
    - 2
    - 3
    - 4
    - 5
    dropout:
    - 0.15
    heads:
    - 4
    experts:
    - 3
    - 4
    learning_rate:
    - 0.0003
    weight_decay:
    - 0.001
    loss:
    - mse
  neural_training:
    max_epochs: 80
    patience: 10
    minimum_improvement: 1.0e-06
    batch_size: 32
    huber_delta: 0.05
    gradient_clip_norm: 1.0

# Workflow-specific settings, independent of the shared defaults.
pv_calibration:
  start_day: null
  end_day_exclusive: null
  delivery_timezone: Europe/Rome
  minimum_dc_fraction_of_ac_rating: 0.05
  minimum_pairs: 100
  validation_fraction: 0.2
  exclude_policy_adjusted: true
  output_root: outputs/pv_calibration
  run_id: null
  farm_ids:
  - 910
  - 1
  - 345
  - 901
  evaluation_start_day: null
  as_of_utc: null
  training_windows_days:
  - null
  - 90
  validation_days: 7
  minimum_training_days: 14
  methods:
  - fixed
  - scale_mse
  - scale_huber
  - thermal_mse
  - thermal_huber
  - tracker_mse
  - tracker_huber
  - bifacial_mse
  - bifacial_huber
  transposition_models:
  - isotropic
  - haydavies
  - perez-driesse
  regularization_values:
  - 0.0
  - 0.01
  huber_delta: 0.05
  parameter_bounds:
    coefficient:
    - 0.2
    - 1.5
    u0:
    - 10.0
    - 60.0
    u1:
    - 0.0
    - 15.0
    gcr:
    - 0.15
    - 0.65
    max_angle:
    - 30.0
    - 80.0
  multistarts: 2
  max_function_evaluations: 180
  optimizer_ftol: 1.0e-11
  optimizer_gtol: 1.0e-09
  seed: 2025
  workers: 4
  resume: true
  retrospective_fit: true
  outage_ghi_threshold_w_m2: 100.0
  bootstrap_block_days: 7
  bootstrap_repetitions: 1000
  representative_days_per_season: 1
  bifacial_sensitivity:
