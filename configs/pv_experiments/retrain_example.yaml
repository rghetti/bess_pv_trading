# Change as_of_utc as new completed measurements become available.
# Remove farm_ids to inherit the standard four-farm selection.
include: ../standard.yaml
farms:
  1: {pv: null}
  345: {pv: null}
  901: {pv: null}
  910: {pv: null}
pv_calibration:
  start_day: '2025-01-01'
  end_day_exclusive: null
  delivery_timezone: Europe/Rome
  minimum_dc_fraction_of_ac_rating: 0.05
  minimum_pairs: 100
  validation_fraction: 0.2
  exclude_policy_adjusted: true
  output_root: outputs/pv_calibration
  run_id: physical_pv_retrain_example
  farm_ids:
  - 910
  evaluation_start_day: null
  as_of_utc: '2025-03-01T00:00:00Z'
  training_windows_days:
  - null
  - 90
  validation_days: 7
  minimum_training_days: 14
  methods:
  - fixed
  - scale_mse
  - scale_huber
  - thermal_mse
  - thermal_huber
  - tracker_mse
  - tracker_huber
  - bifacial_mse
  - bifacial_huber
  transposition_models:
  - isotropic
  - haydavies
  - perez-driesse
  regularization_values:
  - 0.0
  - 0.01
  huber_delta: 0.05
  parameter_bounds:
    coefficient:
    - 0.2
    - 1.5
    u0:
    - 10.0
    - 60.0
    u1:
    - 0.0
    - 15.0
    gcr:
    - 0.15
    - 0.65
    max_angle:
    - 30.0
    - 80.0
  multistarts: 2
  max_function_evaluations: 180
  optimizer_ftol: 1.0e-11
  optimizer_gtol: 1.0e-09
  seed: 2025
  workers: 4
  resume: true
  retrospective_fit: true
  outage_ghi_threshold_w_m2: 100.0
  bootstrap_block_days: 7
  bootstrap_repetitions: 1000
  representative_days_per_season: 1
  bifacial_sensitivity:
    bifaciality:
    - 0.65
    - 0.9
    height_to_pitch_ratio:
    - 0.35
    - 0.5
    albedo:
    - 0.15
    - 0.25
pv:
  direct_exceeds_ghi: clip_and_flag
