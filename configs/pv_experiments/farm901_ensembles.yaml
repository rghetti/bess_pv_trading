# Frozen 2025 fit, Jan-Apr 2026 validation, May-Aug test; no trading rerun.
include: ../standard.yaml
farm_id: 901
pv_ensemble_study:
  source_root: outputs/pv_neural_tuning/neural_hpo_2025_to_2026_08_42cpu
  output_root: outputs/pv_ensembles
  run_id: farm901_tracking_2025_to_2026
  focus_month: 2026-01
  workers: 6
  seed: 73021
  feature_sets:
  - weather
  - tracker
  - bifacial
  models:
  - name: extra_trees_leaf4
    family: extra_trees
    parameters:
      n_estimators: 150
      min_samples_leaf: 4
      max_features: 0.8
  - name: random_forest_leaf4
    family: random_forest
    parameters:
      n_estimators: 150
      min_samples_leaf: 4
      max_features: 0.8
      max_samples: 0.8
  - name: boosting_leaf15
    family: hist_gradient_boosting
    parameters:
      max_iter: 200
      max_leaf_nodes: 15
      learning_rate: 0.05
      l2_regularization: 1.0
  - name: boosting_leaf31
    family: hist_gradient_boosting
    parameters:
      max_iter: 200
      max_leaf_nodes: 31
      learning_rate: 0.05
      l2_regularization: 1.0

# Workflow-specific settings, independent of the shared defaults.
