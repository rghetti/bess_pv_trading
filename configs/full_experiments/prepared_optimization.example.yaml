# Initial pre-DA point-price integrated planning only. No historical replay.
# Supply actual prepared forecasts and explicitly configured equipment first.
include: ../price_experiments/italy_nord.example.yaml
optimization:
  pv_forecast_path: null
  price_forecast_path: null
  decision_cutoff: null
  delivery_day: null
  # PV export: forecast_cycle_time, forecast_available_at, interval_start_utc,
  # interval_end_utc, farm_id, member_id, member_origin, member_probability,
  # pv_ac_mw, input_eligibility, review_status. No review exclusions are accepted.
  pv_model_fit_status: unfitted_explicit_assumption
  pv_model_fit_cutoff: null
  # Price CSV: auction,product_start,price_eur_mwh,available_at,origin,
  # source_time,fit_cutoff. Optional product_end and zone are validated.
  # A missing per-row source_time/fit_cutoff requires the explicit fields below.
  price_forecast_source_time: null
  price_forecast_fit_cutoff: null
  settlement_point_price_eur_per_mwh: null
  settlement_point_price_available_at: null
  settlement_point_price_status: study_assumption
plant:
  farm_id: null
  poi_import_mw: null
  poi_export_mw: null
  assumption_status: user_must_supply_confirmed_or_explicit_study_equipment
battery:
  capacity_mwh: null
  max_power_mw: null
  soc_min_percent: null
  soc_max_percent: null
  efficiency_convention: combined
  combined_charge_efficiency: 0.97
  combined_discharge_efficiency: 0.97
state:
  initial_energy_mwh: null
  terminal_target_mwh: null
  origin: known_delivery_start_assumption
trading:
  trade_limit_mwh: null
  position_limit_mwh: null
  imbalance_penalty_eur_per_mwh: null
  imbalance_limit_mwh: null
  grid_import_fee_eur_per_mwh: null
  settlement_status: supplied_point_price_study_assumption_not_verified_historical_rule
  excluded_charges: [taxes, brokerage]
degradation:
  model: throughput
  cost_eur_per_mwh_throughput: null
  assumptions: user_must_supply_AC_charge_plus_discharge_throughput_cost_assumption
solver:
  threads: 1
  time_limit_seconds: 30.0
  mip_gap: 0.0001
  seed: 17
  output_flag: false
outputs:
  root: outputs/prepared_optimization
  run_id: null
  plots: true
