# January 2025 retrospective PV forecast pilot for the selected farm.
# The pilot deliberately applies the final trained models retrospectively to
# compare their physical/trading effect. This is not an as-known-in-2025 study.
include: ../standard.yaml
continuous_optimization:
  start_date: '2025-01-01'
  end_date: '2025-01-31'
  planning_modes: [integrated, current_auction_only]
  perfect_pv_reference: true
  run_id: continuous_nord_farm${farm_id}_2025-01_forecast_pilot_gme_real
  resume: false
state:
  initial_soc_percent: 90.0
  terminal_soc_percent: 50.0
market:
  valid_from: '2025-01-01'
  valid_to: '2025-01-31'
pv:
  direct_exceeds_ghi: clip_and_flag
  forecast_replacement:
    enabled: true
    fallback: pvlib
    allow_retrospective_artifacts: true
    models_by_farm:
      '1':
        name: farm_1_direct_tcn
        kind: weather_bundle
        artifact_path: models/pv/farm_1/pilot_2025_train/direct_tcn/manifest.json
        available_at_utc: '2026-10-27T00:00:00Z'
      '345':
        name: farm_345_direct_tcn
        kind: weather_bundle
        artifact_path: models/pv/farm_345/pilot_2025_train/direct_tcn/manifest.json
        available_at_utc: '2026-10-27T00:00:00Z'
      '901':
        name: farm_901_direct_tcn_timing
        kind: weather_bundle
        artifact_path: models/pv/farm_901/pilot_2025_train/direct_tcn/manifest.json
        available_at_utc: '2026-10-27T00:00:00Z'
      '910':
        name: farm_910_direct_tcn_timing
        kind: weather_bundle
        artifact_path: models/pv/farm_910/pilot_2025_train/direct_tcn/manifest.json
        available_at_utc: '2026-10-27T00:00:00Z'
transaction_fees:
  mode: gme_real
execution:
  infeasible_auction_policy: previous_plan
  save_infeasibility_diagnostics: true
settlement:
  enabled: true
