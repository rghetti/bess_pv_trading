# January 2026 retrospective trading pilot using PV models fitted to 2025 data.
# Candidate/model selection used Jan-Apr 2026 validation scores; provenance marks
# the resulting strategy as retrospective even though fit targets end in 2025.
include: ../standard.yaml
continuous_optimization:
  start_date: '2026-01-01'
  end_date: '2026-01-31'
  planning_modes: [integrated]
  perfect_pv_reference: true
  perfect_pv_reoptimize_at_each_auction: false
  run_id: continuous_nord_farm${farm_id}_2026-01_soc40_neural_gme_real_v1
  resume: false
state:
  initial_soc_percent: 90.0
  terminal_soc_percent: 50.0
  terminal_soc_min_percent: 40.0
# Match the existing January 2025 continuous study's numerical precision.
solver:
  feasibility_tolerance: 1.0e-08
  integrality_tolerance: 1.0e-08
pv:
  direct_exceeds_ghi: clip_and_flag
  forecast_replacement:
    enabled: true
    fallback: pvlib
    allow_retrospective_artifacts: true
    models_by_farm:
      '1':
        name: farm_1_direct_tcn
        kind: weather_bundle
        artifact_path: models/pv/farm_1/pilot_2025_train/direct_tcn/manifest.json
        available_at_utc: '2026-10-27T00:00:00Z'
      '345':
        name: farm_345_direct_tcn
        kind: weather_bundle
        artifact_path: models/pv/farm_345/pilot_2025_train/direct_tcn/manifest.json
        available_at_utc: '2026-10-27T00:00:00Z'
      '901':
        name: farm_901_direct_tcn_timing
        kind: weather_bundle
        artifact_path: models/pv/farm_901/pilot_2025_train/direct_tcn/manifest.json
        available_at_utc: '2026-10-27T00:00:00Z'
      '910':
        name: farm_910_direct_tcn_timing
        kind: weather_bundle
        artifact_path: models/pv/farm_910/pilot_2025_train/direct_tcn/manifest.json
        available_at_utc: '2026-10-27T00:00:00Z'
transaction_fees:
  mode: gme_real
execution:
  infeasible_auction_policy: previous_plan
  save_infeasibility_diagnostics: true
settlement:
  enabled: true
