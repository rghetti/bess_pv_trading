# January 1 oracle replay plus ex-post realized-PV/full-price schedule comparison.
include: ../standard.yaml
analysis:
  start: '2025-10-01T00:00:00Z'
  end: '2025-10-01T23:45:00Z'
  output_dir: outputs/analysis/farm1_20251001
forecast_run:
  decision_cutoff: '2024-12-31T10:55:00Z'
  delivery_day: '2025-01-01'
  output_dir: outputs/pv/gme_oracle_2025-01-01_farm${farm_id}
pv:
  direct_exceeds_ghi: clip_and_flag
gme_oracle_experiment:
  study_id: gme_nord_oracle_2025-01-01_farm${farm_id}_perfect_pv_comparison
  delivery_day: '2025-01-01'
  timezone: Europe/Rome
  price_database: data/api/market.duckdb
  provider: gme
  zone: NORD
  auction_datasets:
    DA:
      dataset: day_ahead_prices
      native_interval_minutes: null
    IDA1:
      dataset: ida1_prices
      native_interval_minutes: 15
    IDA2:
      dataset: ida2_prices
      native_interval_minutes: 15
    IDA3:
      dataset: ida3_prices
      native_interval_minutes: 15
  missing_auction_policy: skip_if_no_products_fail_if_partial
  price_information: perfect_foresight_actual_clearing_curves
  auction_planning_mode: integrated
  decision_resolution_minutes: 15
  price_display_resolution_minutes: 15
  participating_auctions: null
market:
  valid_from: '2025-01-01'
  valid_to: '2025-01-01'
  result_provenance:
    DA: study_assumption_13:30_for_historical_day
    IDA1: study_assumption_15:30_for_historical_day
    IDA2: study_assumption_22:30_for_historical_day
    IDA3: study_assumption_10:30_for_historical_day
forecast:
  initial_decision_cutoff: '2024-12-31T10:55:00Z'
state:
  terminal_soc_percent: null
solver:
  feasibility_tolerance: 1.0e-08
  integrality_tolerance: 1.0e-08
experiment_outputs:
  root: outputs/full_experiments/gme_oracle
  pv_only_baseline: true
  run_id: gme_nord_oracle_2025-01-01_farm${farm_id}_native_ida_pt15_perfect_pv_comparison
settlement:
  enabled: true
reoptimization_baseline:
  enabled: true
  freeze_after_auctions: null
  plots: true
