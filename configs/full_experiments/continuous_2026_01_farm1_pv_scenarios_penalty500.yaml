include: ../standard.yaml
farm_id: 1
continuous_optimization:
  start_date: '2026-01-01'
  end_date: '2026-01-31'
  planning_modes: [integrated]
  perfect_pv_reference: true
  perfect_pv_reoptimize_at_each_auction: false
  run_id: 2026_01_pv_scenarios_penalty500
  pv_ensemble:
    enabled: true
    zarr: data/farms/nwp_ens_20260101_20260131.zarr
    member_count: 50
state:
  initial_soc_percent: 90.0
  terminal_soc_percent: 50.0
  terminal_soc_min_percent: 40.0
solver:
  feasibility_tolerance: 1.0e-08
  integrality_tolerance: 1.0e-08
pv:
  direct_exceeds_ghi: clip_and_flag
trading:
  optimize_imbalances: true
  imbalance_penalty_eur_per_mwh: 500.0
  imbalance_price_eur_per_mwh: 0.0
transaction_fees:
  mode: gme_real
execution:
  infeasible_auction_policy: previous_plan
  save_infeasibility_diagnostics: true
settlement:
  enabled: true

# Workflow-specific settings, independent of the shared defaults.
gme_oracle_experiment:
  study_id: null
