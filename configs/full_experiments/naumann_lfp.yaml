# Opt-in research configuration, not a manufacturer-specific lifetime forecast.
# Loading this file runs no experiment. Approve a concrete run plan before dispatch studies.
include: ../standard.yaml
farm_id: 345
plant:
  assumption_status: hypothetical_stationary_LFP_pack_with_Naumann_cell_prior
battery:
  capacity_mwh: 1.0
  max_power_mw: 0.5
  self_discharge_per_hour: 0.0
  assumption_status: nominal_MWh_pack_scaled_from_ideal_identical_LFP_cells_at_25C
state:
  initial_soc_percent: 50.0
  initial_soc_basis: available_capacity
  initial_energy_mwh: 0.5
  terminal_soc_percent: 50.0
  terminal_soc_basis: available_capacity
  origin: known_delivery_start_assumption
degradation:
  model: naumann_lfp
  cost_eur_per_mwh_throughput: 0.0
  throughput_lifetime: null
  assumptions: >-
    Naumann 2018/2020 Sony/Murata LFP/graphite research prior. Independent calendar
    and cycling squared-loss exposures with carried dual Xu banks; fixed 25 C.
    Capacity loss is an Ah-to-MWh proxy. No temperature, resistance, shallow-cycle
    recovery, Huawei/BYD calibration, or automatic replacement is represented.
    Replacement economics inherited from standard.yaml are a separate generic cost assumption.
  naumann:
    reference_temperature_c: 25.0
    calendar_reference_coefficient: 0.000012571
    calendar_soc_cubic: 2.8575
    calendar_soc_intercept: 0.60225
    cycle_rate_slope: 0.063
    cycle_rate_intercept: 0.0971
    cycle_depth_cubic: 4.0253
    cycle_depth_offset: 0.6
    cycle_depth_intercept: 1.0923
    depth_knots: [0, .005, .01, .025, .05, .075, .10, .15, .20, .30, .40, .50, .60, .70, .80, .90, 1]
    c_rate_bin_width: 0.025
    nominal_c_rate_max: 1.0
    effective_c_rate_limit: 1.0
    end_of_life_soh: 0.8
    sqrt_loss_error_budget: 0.00001
    calendar_annual_soh_error_budget: 0.0001
    calendar_initial_soc_segments: 16
    max_loss_fraction: 0.3
    calendar_year_seconds: 31557600.0
    max_graph_points: 4097
    timezone: Europe/Rome
    calibration_id: naumann_lfp_2018_2020_independent_exposure_v1
    provenance:
      calendar_source: https://doi.org/10.1016/j.est.2018.01.019
      cycle_source: https://doi.org/10.1016/j.jpowsour.2019.227666
      cell: Sony_Murata_US26650FTC1_LFP_graphite_2.85Ah_rated_3Ah_measured
      normalization: original_nominal_Ah_approximated_by_internal_MWh_at_fixed_voltage
      calendar_time_unit: seconds
      fitted_rate_range_c: [0.2, 1.0]
      tested_depth_range: [0.01, 1.0]
      depth_factor_fit_range: [0.05, 1.0]
      dynamic_extension: independent_squared_loss_exposures_not_original_combined_virtual_FEC
      variable_rate_extension: local_half_cycle_rate_dose_not_completed_cycle_mean_rate
      transfer_status: hypothetical_pack_not_verified_farm_or_manufacturer_parameters
synthetic:
  delivery_day: '2025-10-02'
  seed: 17
  branches_per_auction: 1
  branch_values: [0.0]
  branch_probabilities: [1.0]
  pv_peak_mw: 0.8
  sunrise_hour: 7.0
  sunset_hour: 19.0
  base_price_eur_per_mwh: 70.0
  daily_price_amplitude: 15.0
  residual_scale: {DA: 8.0, IDA1: 5.0, IDA2: 4.0, IDA3: 3.0}
  stage_spreads: {IDA1: -3.0, IDA2: 2.0, IDA3: 4.0}
  imbalance_price_eur_per_mwh: 60.0
  strategies: [deterministic_integrated]
trading:
  optimize_imbalances: true
  imbalance_penalty_eur_per_mwh: 100.0
  settlement_status: synthetic_signed_single_price
  excluded_charges: [grid_use_fee, taxes, brokerage]
execution:
  dispatch_policy: follow_battery_plan
  reoptimize_physical_controls: true
continuous_optimization:
  # The active workflow has one delivery-day end, without the removed IDA3 look-ahead policy.
  ida3_next_day_horizon: false
  ida3_enforce_intermediate_soc: false
  terminal_soc_scope: each_delivery_day
solver:
  threads: 1
  time_limit_seconds: 60.0
  mip_gap: 0.0001
