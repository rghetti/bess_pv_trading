# Stage all current native Excel exports without opening the live API database.
# Use the generated import.yaml for the later merge and complete-history audit.
include: ../standard.yaml

# Workflow-specific settings, independent of the shared defaults.
api:
  start: null
  end: null
  timezone: Europe/Rome
  download_order: month_first
  cache_directory: data/api
  storage_backend: duckdb
  database_path: data/api/market.duckdb
  database_threads: 4
  output_directory: outputs/api
  no_data_cache_hours: 24
  progress_every: 25
  plots: true
  terna_authorization_scheme: bearer
  terna_request_period: month
  terna_http_403_policy: continue_other_providers
  gme_token_refresh_seconds: 900
  credentials:
    entsoe_token_env: ENTSOE_API_TOKEN
    terna_client_id_env: TERNA_CLIENT_ID
    terna_client_secret_env: TERNA_CLIENT_SECRET
    gme_username_env: GME_USERNAME
    gme_password_env: GME_PASSWORD
  http:
    attempts: 3
    connect_timeout: 10
    read_timeout: 60
    retry_delay_seconds: 1
    minimum_request_interval_seconds: 0.25
    terna_minimum_request_interval_seconds: null
    max_retry_delay_seconds: 10
  requests: []

manual_market_import:
  source_directory: data
  stage_directory: data/staging/manual_market
  stage_path: null
  target_database: ${api.database_path}
  duckdb_threads: ${api.database_threads}
  zone: NORD
  timezone: Europe/Rome
  date_start: '2025-01-01'
  date_end_exclusive: null
  gme_glob: '*_PrezziZonali_Nord.xlsx'
  terna_glob: Riepilogo_Mensile_Quarto_Orario_*.xlsx
  gme_schema_config: configs/api_experiments/gme_workbook_import.yaml
  terna_schema_config: configs/api_experiments/terna_workbook_import.yaml
  terna_ambiguous_time_policy: ${terna_workbook_import.ambiguous_time_policy}
  ida3_start_clock: '12:00'
  audit_delivery_days:
  - '2025-01-01'
  - '2025-03-30'
  - '2025-03-31'
  - '2025-04-01'
  - '2025-10-01'
  - '2025-10-26'
  - '2026-03-29'
  - '2026-04-01'
  check_report_path: outputs/data_imports/manual_market/postcheck.json
  datasets:
  - provider: gme
    dataset: day_ahead_prices
  - provider: gme
    dataset: ida1_prices
  - provider: gme
    dataset: ida2_prices
  - provider: gme
    dataset: ida3_prices
  - provider: terna
    dataset: imbalance_prices

terna_workbook_import:
  ambiguous_time_policy: second_occurrence_minute_marker
