# A one-day Italy NORD request. End is exclusive in the configured timezone.
# Change the dates before a historical download; keep tokens out of YAML.
include: ../standard.yaml
api:
  start: '2025-10-01'
  end: '2025-10-02'
  timezone: Europe/Rome
  download_order: month_first
  cache_directory: data/api
  storage_backend: duckdb
  database_path: data/api/market.duckdb
  database_threads: 4
  output_directory: outputs/api
  no_data_cache_hours: 24
  progress_every: 25
  plots: true
  terna_authorization_scheme: bearer
  terna_request_period: month
  terna_http_403_policy: continue_other_providers
  gme_token_refresh_seconds: 900
  credentials:
    entsoe_token_env: ENTSOE_API_TOKEN
    terna_client_id_env: TERNA_CLIENT_ID
    terna_client_secret_env: TERNA_CLIENT_SECRET
    gme_username_env: GME_USERNAME
    gme_password_env: GME_PASSWORD
  http:
    attempts: 3
    connect_timeout: 10
    read_timeout: 60
    retry_delay_seconds: 1
    minimum_request_interval_seconds: 0.25
    terna_minimum_request_interval_seconds: null
    max_retry_delay_seconds: 10
  requests:
  - provider: entsoe
    dataset: day_ahead_prices
    options:
      zone: NORD
      zone_eic: 10Y1001A1001A73I
  - provider: entsoe
    dataset: load_forecast
    options:
      zone: NORD
      zone_eic: 10Y1001A1001A73I
  - provider: entsoe
    dataset: generation_forecast
    options:
      zone: NORD
      zone_eic: 10Y1001A1001A73I
  - provider: entsoe
    dataset: solar_forecast
    options:
      zone: NORD
      zone_eic: 10Y1001A1001A73I
  - provider: entsoe
    dataset: wind_onshore_forecast
    options:
      zone: NORD
      zone_eic: 10Y1001A1001A73I
farm_id: 1
