# A one-day Italy NORD request. End is exclusive in the configured timezone.
# Change the dates before a historical download; keep tokens out of YAML.
include: ../standard.yaml
api:
  start: '2025-10-01'
  end: '2025-10-02'
  requests:
    - provider: entsoe
      dataset: day_ahead_prices
      options:
        zone: NORD
        zone_eic: 10Y1001A1001A73I
    - provider: entsoe
      dataset: load_forecast
      options:
        zone: NORD
        zone_eic: 10Y1001A1001A73I
    - provider: entsoe
      dataset: generation_forecast
      options:
        zone: NORD
        zone_eic: 10Y1001A1001A73I
    - provider: entsoe
      dataset: solar_forecast
      options:
        zone: NORD
        zone_eic: 10Y1001A1001A73I
    - provider: entsoe
      dataset: wind_onshore_forecast
      options:
        zone: NORD
        zone_eic: 10Y1001A1001A73I
farm_id: 1
