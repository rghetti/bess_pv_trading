# Existing ENTSO-E DA prices are retained; acquire the missing actual IDA labels.
include: ../standard.yaml
api:
  start: '2025-01-01'
  end: '2026-09-01'
  output_directory: outputs/api/gme
  http:
    attempts: 5
    minimum_request_interval_seconds: 2.0
    retry_delay_seconds: 2.0
    max_retry_delay_seconds: 30.0
  requests:
    - provider: gme
      dataset: ida1_prices
      options:
        zone: NORD
    - provider: gme
      dataset: ida2_prices
      options:
        zone: NORD
    - provider: gme
      dataset: ida3_prices
      options:
        zone: NORD
farm_id: 1
