# Full farm-record window, including pre-quarter-hour price-training context.
# Native hourly prices remain hourly; no artificial quarter-hour prices are made.
include: ../standard.yaml
api:
  start: '2025-01-01'
  end: '2026-09-01'
  timezone: Europe/Rome
  download_order: month_first
  cache_directory: data/api
  storage_backend: duckdb
  database_path: data/api/market.duckdb
  database_threads: 4
  output_directory: outputs/api
  no_data_cache_hours: 24
  progress_every: 25
  plots: true
  terna_authorization_scheme: bearer
  terna_request_period: month
  terna_http_403_policy: continue_other_providers
  gme_token_refresh_seconds: 900
  credentials:
    entsoe_token_env: ENTSOE_API_TOKEN
    terna_client_id_env: TERNA_CLIENT_ID
    terna_client_secret_env: TERNA_CLIENT_SECRET
    gme_username_env: GME_USERNAME
    gme_password_env: GME_PASSWORD
  http:
    attempts: 8
    connect_timeout: 10
    read_timeout: 60
    retry_delay_seconds: 2.0
    minimum_request_interval_seconds: 0.5
    terna_minimum_request_interval_seconds: 2.0
    max_retry_delay_seconds: 30.0
  requests:
  - provider: entsoe
    dataset: day_ahead_prices
    options:
      zone: NORD
      zone_eic: 10Y1001A1001A73I
  - provider: entsoe
    dataset: load_forecast
    options:
      zone: NORD
      zone_eic: 10Y1001A1001A73I
  - provider: entsoe
    dataset: generation_forecast
    options:
      zone: NORD
      zone_eic: 10Y1001A1001A73I
  - provider: entsoe
    dataset: solar_forecast
    options:
      zone: NORD
      zone_eic: 10Y1001A1001A73I
  - provider: entsoe
    dataset: wind_onshore_forecast
    options:
      zone: NORD
      zone_eic: 10Y1001A1001A73I
  - provider: terna
    dataset: total_load
    options:
      zone: NORD
      bidding_zones:
      - North
  - provider: terna
    dataset: total_load_forecast
    options:
      zone: NORD
      bidding_zones:
      - North
  - provider: terna
    dataset: load_forecast
    options:
      zone: NORD
      session_type: MGP
  - provider: terna
    dataset: wind_forecast
    options:
      zone: NORD
      session_type: MSD1
  - provider: terna
    dataset: renewable_generation
    options:
      zone: IT
      energy_sources:
      - Photovoltaic
      - Wind
farm_id: 1
