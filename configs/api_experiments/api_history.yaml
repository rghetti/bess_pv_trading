# Full farm-record window, including pre-quarter-hour price-training context.
# Native hourly prices remain hourly; no artificial quarter-hour prices are made.
include: ../standard.yaml
api:
  start: '2025-01-01'
  end: '2026-09-01'
  http:
    attempts: 8
    minimum_request_interval_seconds: 0.5
    terna_minimum_request_interval_seconds: 2.0
    retry_delay_seconds: 2.0
    max_retry_delay_seconds: 30.0
  requests:
    - provider: entsoe
      dataset: day_ahead_prices
      options:
        zone: NORD
        zone_eic: 10Y1001A1001A73I
    - provider: entsoe
      dataset: load_forecast
      options:
        zone: NORD
        zone_eic: 10Y1001A1001A73I
    - provider: entsoe
      dataset: generation_forecast
      options:
        zone: NORD
        zone_eic: 10Y1001A1001A73I
    - provider: entsoe
      dataset: solar_forecast
      options:
        zone: NORD
        zone_eic: 10Y1001A1001A73I
    - provider: entsoe
      dataset: wind_onshore_forecast
      options:
        zone: NORD
        zone_eic: 10Y1001A1001A73I
    - provider: terna
      dataset: total_load
      options:
        zone: NORD
        bidding_zones:
          - North
    - provider: terna
      dataset: total_load_forecast
      options:
        zone: NORD
        bidding_zones:
          - North
    - provider: terna
      dataset: load_forecast
      options:
        zone: NORD
        session_type: MGP
    - provider: terna
      dataset: wind_forecast
      options:
        zone: NORD
        session_type: MSD1
    - provider: terna
      dataset: renewable_generation
      options:
        zone: IT
        energy_sources:
          - Photovoltaic
          - Wind
farm_id: 1
