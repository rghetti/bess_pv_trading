# Small retrospective pipeline check using the first complete forecast month.
# Retrieved revisions do not establish availability before historical DA closure.
include: ../standard.yaml
price_experiment:
  analysis_directory: data/analysis/price_fundamentals
  output_directory: outputs/price_fundamentals
  min_training_days: 14
  holdout_days: 7
  start: '2025-01-01'
  end: '2025-02-01'
  fundamental_features:
    load_forecast_mw:
      provider: entsoe
      dataset: load_forecast
    solar_forecast_mw:
      provider: entsoe
      dataset: solar_forecast
    wind_forecast_mw:
      provider: entsoe
      dataset: wind_onshore_forecast
  comparison_models:
    ridge_lags: []
    ridge_load:
      - load_forecast_mw
    ridge_load_solar_wind:
      - load_forecast_mw
      - solar_forecast_mw
      - wind_forecast_mw
farm_id: 1
