# No download or credentials: completed native-price caches are read once.
include: ../standard.yaml
linear_price_study:
  output_directory: outputs/linear_price_studies/prices
  analysis_directory: data/analysis/linear_prices/prices
  validation_days: 28
  calibration_days: 42
  maturity_gap_days: 1
  test_days: 42
  min_training_days: 56
  refit_every_days: 7
  alphas:
    - 1.0
    - 100.0
  training_windows_days:
    - 90
    - 180
  targets:
    - level
    - delta_day
  feature_sets:
    lags:
      - calendar
      - autoregressive
    expert:
      - calendar_extended
      - autoregressive_extended
      - daily_summary
      - rolling_history_7d
      - interactions
    profile:
      - calendar_extended
      - autoregressive_extended
      - daily_summary
      - daily_profile_lags
      - hour_categories
      - weekday_categories
  feature_settings:
    lag_days:
      - 1
      - 2
      - 3
      - 7
    daily_summary_lags:
      - 1
      - 7
    rolling_windows:
      - 7
    daily_profile_lags:
      - 1
      - 7
    profile_block_hours: 6
price_scenarios:
  covariance_shrinkage: 0.5
  minimum_complete_days: 10
  sample_count: 100
  seed: 41
farm_id: 1
