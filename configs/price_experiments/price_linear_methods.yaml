# Compare fitting methods on the identical saved DuckDB-derived old features.
# Additional September–October labels cannot enter this development comparison.
include: ../standard.yaml
linear_price_study:
  cache_directory: data/api/market.duckdb
  output_directory: outputs/linear_price_studies/fitting_methods
  analysis_directory: data/analysis/linear_prices/fitting_methods
  validation_days: 28
  calibration_days: 42
  maturity_gap_days: 1
  test_days: 42
  min_training_days: 56
  min_group_training_days: 56
  refit_every_days: 7
  model_structures:
    - by_hour
  alphas:
    - 100.0
  training_windows_days:
    - 90
  targets:
    - level
  feature_sets:
    lags:
      - calendar_extended
      - autoregressive_extended
    profile:
      - calendar_extended
      - autoregressive_extended
      - daily_summary
      - daily_profile_lags
  feature_settings:
    lag_days:
      - 1
      - 2
      - 3
      - 7
    daily_summary_lags:
      - 1
      - 7
    rolling_windows:
      - 7
    daily_profile_lags:
      - 1
      - 7
    profile_block_hours: 6
  frozen_feature_manifest: outputs/linear_price_studies/hourly_structure/20261016T132545.918238Z/manifest.json
  end: '2026-09-01'
  additional_estimators:
    - name: ols
      method: ols
    - name: lasso_a01
      method: lasso
      alpha: 0.1
    - name: elastic_a01
      method: elastic_net
      alpha: 0.1
      l1_ratio: 0.5
    - name: huber_a1
      method: huber
      alpha: 1.0
      epsilon: 1.35
    - name: weighted_h14
      method: weighted_ridge
      alpha: 100.0
      half_life_days: 14
    - name: weighted_h28
      method: weighted_ridge
      alpha: 100.0
      half_life_days: 28
  prior_evaluation_overlap: Development comparison using the previously inspected July–August 2026 quarter-hour
    and August–September 2025 hourly periods. Estimator settings are selected by earlier validation MAE only.
    This comparison does not inspect or select from the September–October 2026 extension.
price_scenarios:
  covariance_shrinkage: 0.5
  minimum_complete_days: 10
  sample_count: 100
  seed: 41
farm_id: 1
