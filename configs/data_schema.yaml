# Exact mappings verified by read-only consolidated-metadata inspection.
schema_version: 1
inputs:
  zarr: data/farms/pv_farms_timeseries_20250101_20260831.zarr
  metadata_parquet: data/farms/pv_farms_timeseries_20250101_20260831.parquet
source:
  timezone: UTC
  historical_dimensions: [time, farm_id]
  forecast_dimensions: [farm_id, cycle_time, lead_time]
  measured_power_basis: AC
  capacity_basis: DC
  historical_interval_minutes: 15
  historical_label: start
  forecast_radiation_label: end
  forecast_radiation_interval_hours: 1
  cycle_cadence_hours: 6
  availability_lag_hours: 4
  explicit_availability_variable: null
  telemetry_latency_minutes: 0
  numeric_lead_units: hours
forecast_mapping:
  forecast_ghi: shortwave_radiation
  forecast_bhi: direct_radiation
  temperature_c: temperature_2m
  dew_point_c: dew_point_2m
  cloud_total_pct: cloud_cover
  cloud_low_pct: cloud_cover_low
  cloud_mid_pct: cloud_cover_mid
  cloud_high_pct: cloud_cover_high
  precipitation_mm: precipitation
  snow_water_equivalent_m: snow_water_equivalent
  visibility_km: visibility
  wind_u_10m: wind_u_component_10m
  wind_v_10m: wind_v_component_10m
  wind_u_100m: wind_u_component_100m
  wind_v_100m: wind_v_component_100m
forecast_semantics:
  forecast_ghi: hourly_mean
  forecast_bhi: hourly_mean
  precipitation_mm: hourly_accumulation
  default: instantaneous
policy:
  version: requested-v1
  plateau:
    enabled: true
    minimum_run: 4
    atol_kw: 0.01
    rtol: 0.0001
    native_minutes: 15
  night:
