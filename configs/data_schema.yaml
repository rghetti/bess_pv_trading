  nonnegative_forecasts: [forecast_ghi, forecast_bhi, precipitation_mm, snow_water_equivalent_m, visibility_km, cloud_total_pct, cloud_low_pct, cloud_mid_pct, cloud_high_pct]
  interpolation:
    enabled: true
    variables: [power, ghi]
    maximum_gap_hours: null
  evidence_availability: endpoint_and_mask_evidence
review:
  exclusions_csv: null
