# Compare shared and hour-specific linear coefficients on the same native data.
# Quarter-hour products within an hour can share coefficients; DST folds cannot.
# This is a new retrospective comparison, not a fresh prospective holdout.
include: price_experiment.yaml
linear_price_study:
  cache_directory: data/api/market.duckdb
  output_directory: outputs/linear_price_studies/hourly_structure
  analysis_directory: data/analysis/linear_prices/hourly_structure
  validation_days: 28
  calibration_days: 42
  maturity_gap_days: 1
  test_days: 42
  min_training_days: 56
  min_group_training_days: 56
  refit_every_days: 7
  model_structures: [pooled, by_hour]
  alphas: [10.0, 100.0]
  training_windows_days: [90]
  targets: [level, delta_day]
  feature_sets:
    lags: [calendar_extended, autoregressive_extended]
    profile: [calendar_extended, autoregressive_extended, daily_summary, daily_profile_lags]
  feature_settings:
    lag_days: [1, 2, 3, 7]
    daily_summary_lags: [1, 7]
    rolling_windows: [7]
    daily_profile_lags: [1, 7]
    profile_block_hours: 6
price_scenarios:
  enabled: true
  covariance_shrinkage: 0.5
  minimum_complete_days: 10
  sample_count: 100
  seed: 41
