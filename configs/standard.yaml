      location: {latitude: 45.6495, longitude: 13.7768, location_status: proxy, acknowledged: true}
      direct_exceeds_ghi: clip_and_flag
      transposition_model: isotropic
      albedo: 0.2
      bifacial:
        enabled: false
        bifaciality: 0.8
        height_to_pitch_ratio: 0.4
        shade_factor: -0.02
        transmission_factor: 0.0
      output:
        method: calibrated_scale
        calibrated_coefficient: 0.8899355438128487
        assumption_status: global_2025_fit_treated_as_prior_farm_metadata; source=configs/pv_parameters/2025/farm_901.json
      tracker:
        gcr: 0.6385656354705106
        max_angle: 57.91350435093605
  910:
    ac_capacity_kw: 6638.0
    tracking_type_id: 1
    battery:
      capacity_mwh: 5.0
      max_power_mw: 2.5
    pv:
      # Solar-position proxy selected by the full-period realized-irradiance comparison;
      # this is not a verified farm location.
      location: {latitude: 45.4384, longitude: 10.9916, location_status: proxy, acknowledged: true}
      direct_exceeds_ghi: clip_and_flag
      transposition_model: perez-driesse
      albedo: 0.2
      bifacial:
        enabled: false
        bifaciality: 0.8
        height_to_pitch_ratio: 0.4
        shade_factor: -0.02
        transmission_factor: 0.0
      output:
        method: calibrated_scale
        calibrated_coefficient: 0.8050110294570347
        assumption_status: global_2025_fit_treated_as_prior_farm_metadata; source=configs/pv_parameters/2025/farm_910.json
      tracker:
        gcr: 0.5667211662668288
        max_angle: 30.0

# PREPARATION AND PV CONVERSION: dates/output IDs belong in the experiment override.
analysis:
  policy_context: complete_selected_farm_history
forecast_run:
  decision_cutoff: null
  delivery_day: null
  delivery_timezone: Europe/Rome
  earlier_complete_vintage_fallback: false
  output_dir: outputs/pv
pv:
  # Optional immutable, farm-specific registry; only artifacts issued by the cutoff are used.
  parameter_registry: null
  forecast_replacement:
    enabled: false
    fallback: pvlib
    allow_retrospective_artifacts: false
    # Selected per-farm pilot bundles are ready for continuous optimization.
    # Replacement remains disabled by default; enable explicitly in an experiment.
    models_by_farm:
      '1': {name: farm_1_direct_tcn, kind: weather_bundle, artifact_path: models/pv/farm_1/pilot_2025_train/direct_tcn/manifest.json, available_at_utc: '2026-10-27T00:00:00Z'}
      '345': {name: farm_345_direct_tcn, kind: weather_bundle, artifact_path: models/pv/farm_345/pilot_2025_train/direct_tcn/manifest.json, available_at_utc: '2026-10-27T00:00:00Z'}
      '901': {name: farm_901_direct_tcn_timing, kind: weather_bundle, artifact_path: models/pv/farm_901/pilot_2025_train/direct_tcn/manifest.json, available_at_utc: '2026-10-27T00:00:00Z'}
      '910': {name: farm_910_direct_tcn_timing, kind: weather_bundle, artifact_path: models/pv/farm_910/pilot_2025_train/direct_tcn/manifest.json, available_at_utc: '2026-10-27T00:00:00Z'}
  transposition_model: isotropic
  bifacial:
    enabled: false
    bifaciality: 0.8
    height_to_pitch_ratio: 0.4
    shade_factor: -0.02
    transmission_factor: 0.0
  shortwave_interpretation: ghi
  shortwave_interpretation_status: user_confirmed
  direct_radiation_interpretation: horizontal_direct
  direct_radiation_interpretation_status: user_working_assumption
  fraction_diffuse_enabled: false
  source_azimuth_positive: east
  location:
    latitude: 45.4642
    longitude: 9.19
    location_status: proxy
    acknowledged: true
  irradiance_redistribution: uniform
  direct_exceeds_ghi: invalidate
  ghi_only_decomposition: null
  low_sun_zenith_deg: 85.0
  dni_limit_w_m2: 1400.0
  dni_limit_action: cap_and_flag
  tracker:
    assumptions_acknowledged: true
    axis_tilt: 0.0
    axis_azimuth: 0.0
    max_angle: 60.0
    backtrack: true
    gcr: 0.35
  bifacial_front_side_only_enabled: true
  albedo: 0.2
  temperature:
    model: faiman
    u0: 25.0
    u1: 6.84
    wind_height_m: 10
    wind_as_module_proxy_acknowledged: true
  dc:
    model: pvwatts
    # Assumed AC-nameplate-to-DC-reference ratio; independent of fitted AC scale.
    reference_conversion_efficiency: 0.96
    gamma_pdc_per_c: -0.004
    reference_temperature_c: 25.0
  output:
    method: explicit_efficiency
    # Used only as the DC-to-AC multiplier in explicit-efficiency mode.
    pv_output_efficiency: 0.96
    # Set to the offline fitted coefficient when method is calibrated_scale.
    calibrated_coefficient: null
    assumption_status: illustrative_unfitted_pv_output_model
    transformer_efficiency: 1.0
    transformer_assumption_status: no_measured_transformer_loss_assumed
    ac_limit_mw: auto
# The versioned CSV alone defines production-quality exclusions. Model corpora
# omit each excluded quarter's complete feature/target instance in every split.
pv_data_quality:
  exclusions_csv: configs/data_quality/pv_excluded_episodes_2025_to_2026_08.csv  # Sole production-quality exclusion source; null disables it.
  remove_excluded_instances: true  # Drop complete feature/AC-target rows from every modeling split.
forecast:
  farm_id: ${farm_id}
  initial_decision_cutoff: null
  member_policy: one_deterministic_weather_vintage
  reoptimization_pv_policy: latest_available_forecast_at_each_reoptimization
  realized_power_policy: use_actual_ac_for_execution_and_boundary_state_when_available
  realized_power_variable: power
  realized_power_scale_to_mw: 0.001
  missing_forecast_policy: zero_only_when_policy_marks_night
  missing_realized_power_policy: use_frozen_pv_forecast
  maximum_missing_realized_intervals: 4
  initialization_cutoff: null

# MARKET CALENDAR: local Europe/Rome gates; DA hourly / IDA quarter-hour native products are separate.
market:
  zone: NORD
  timezone: Europe/Rome
  valid_from: '2025-10-01'
  valid_to: '2026-08-31'
  decision_buffer_minutes: 5.0
  gates:
    DA: '12:00'
    IDA1: '15:00'
    IDA2: '22:00'
    IDA3: '10:00'
  gate_day_offsets:
    DA: -1
    IDA1: -1
    IDA2: -1
    IDA3: 0
  result_times:
    DA: '13:30'
    IDA1: '15:30'
    IDA2: '22:30'
    IDA3: '10:30'
  delivery_start_times:
    # Earliest tradable delivery and earliest dispatch replaced by that auction.
    # Gate/submission times determine forecast availability, not this boundary.
    DA: null
    IDA1: null
    IDA2: null
    IDA3: '12:00'
  result_provenance:
    DA: study_assumption_13:30; GME final results not earlier than 13:05; recorded timestamps preferred
    IDA1: 'GME DTF03 rev13: results by 15:30 local'
    IDA2: 'GME DTF03 rev13: results by 22:30 local'
    IDA3: 'GME DTF03 rev13: results by 10:30 local'
  cancelled_auctions: []

# PHYSICAL ASSETS: BESS powers are AC bus MW, capacity is internal MWh, SOC settings are percentages.
# The POI auto rule is an explicit illustrative proxy.
plant:
  farm_id: ${farm_id}
  poi_import_mw: auto
  poi_export_mw: auto
  assumption_status: illustrative_symmetric_POI_equal_to_AC_nameplate_not_measured
battery:
  # Resolve from farms.<plant.farm_id>.battery; numeric study overrides remain supported.
  capacity_mwh: auto
  max_power_mw: auto
  soc_min_percent: 7.0
  soc_max_percent: 93.0
  efficiency_convention: combined
  # Symmetric effective AC-to-stored-energy efficiencies: sqrt(0.90) per direction.
  # Their product gives 90% AC-to-AC round-trip efficiency, including conversion losses.
  combined_charge_efficiency: 0.9486832980505138
  combined_discharge_efficiency: 0.9486832980505138
  self_discharge_per_hour: 0.0
  assumption_status: illustrative_not_confirmed_battery_specification
state:
  initial_soc_percent: 50.0
  initial_soc_basis: nominal_capacity
  initial_state_status: study_assumption_not_telemetry
  terminal_soc_percent: 50.0
  # Optional minimum target enforced at every optimization horizon end.
  terminal_soc_min_percent: null
  origin: known_delivery_start_assumption

# DEGRADATION: current throughput economics. Direct-cost and Xu experiments override this block.
# Set replacement_economics / throughput_lifetime to null to use direct configured coefficients.
degradation:
  model: throughput
  cost_eur_per_mwh_throughput: null
  replacement_cost_eur: null
  stress_coefficient: 0.000524
  stress_exponent: 2.03
  segment_count: 8
  assumptions: Generic 2024 BNEF pack-price replacement proxy converted at the 2024-12-31 ECB FX rate; excludes
    labor, inverter, BOS and salvage. Reference LFP cycle life is 2500 cycles at 80% DoD to 80% residual capacity
    (Victron Lithium NG). Constant nominal-energy lifetime approximation; no calendar aging or battery-specific
    lifetime calibration. Cost applies to charge plus discharge AC throughput, normalized using the configured
    charge/discharge efficiencies.
  replacement_economics:
    pack_price_usd_per_kwh: 115.0
    cost_year: 2024
    price_scope: global_generic_lithium_ion_pack_average_not_installed_BESS
    price_source: https://about.bnef.com/insights/commodities/lithium-ion-battery-pack-prices-see-largest-drop-since-2017-falling-to-115-per-kilowatt-hour-bloombergnef/
    price_publication_date: '2024-12-10'
    usd_per_eur: 1.0389
    fx_date: '2024-12-31'
    fx_source: https://www.ecb.europa.eu/stats/exchange/eurofxref/shared/pdf/2024/12/20241231.pdf
    additional_replacement_eur_per_kwh: 0.0
    salvage_fraction: 0.0
    retrieved_on: '2026-10-19'
  throughput_lifetime:
    cycle_life: 2500
    reference_depth_of_discharge: 0.8
    end_of_life_capacity_fraction: 0.8
    source: https://www.victronenergy.com/media/pg/Lithium_NG_battery_51%2C2_V/en/technical-data.html
    scope: illustrative_LFP_reference_life_applied_to_generic_pack_price

# TRADING AND EXECUTION: current historical study uses exact planned delivery and grid feedback.
# Legacy synthetic/prepared examples explicitly retain their earlier execution and imbalance settings.
trading:
  optimize_imbalances: false
  imbalance_penalty_eur_per_mwh: 0.0
  grid_import_fee_eur_per_mwh: 0.0
  imbalance_limit_mwh: null
  imbalance_price_eur_per_mwh: 0.0
  settlement_status: exact_planned_delivery_actual_terna_quarter_hour_settlement_ex_post
  planned_delivery_balance_resolution_minutes: null
transaction_fees:
  # Progressive GME MPE variable fees on gross purchases plus sales, by submission month.
  # The first 20,000 MWh/month are exempt. none and flat remain explicit overrides.
  mode: gme_real
  flat_eur_per_mwh: 0.0
  timezone: Europe/Rome
  operator_scope: standalone_plant
  # The published structure is assumed unchanged over this historical study window;
  # unsupported dates fail. Fixed membership/annual/ACER charges are not included.
  tariffs:
    - version: gme_mpe_published_structure_assumed_2024_2026
      valid_from: '2024-12-01'
      valid_to: '2026-12-31'
      applicability: assumed_unchanged
      source: https://gme.mercatoelettrico.org/it-it/Home/Accesso-ai-Mercati/Elettricita/MercatiElettrici/CorrispettiviSettlement/CorrispettiviElettricita
      thresholds_mwh:
        - 20000.0
        - 1000000.0
        - 10000000.0
      marginal_eur_per_mwh:
        - 0.0
        - 0.04
        - 0.03
        - 0.02
  initial_state:
    as_of: '2024-12-01T00:00:00+01:00'
    monthly_volume_mwh:
      2024-12: 0.0
    cumulative_fees_eur: 0.0
    provenance: Standalone simulated operator starts with zero December 2024 traded volume and no external portfolio activity. Subsequent months start at zero and continuous execution carries actual submitted volume. Replace this assumption with known operator-level volume when applicable.
execution:
  dispatch_policy: track_committed_grid
  reoptimize_physical_controls: false
  comparison_tolerance_mw: 1.0e-06
  infeasible_auction_policy: error
  save_infeasibility_diagnostics: false
settlement:
  enabled: false
  database_path: data/api/market.duckdb
  provider: terna
  dataset: imbalance_prices
  zone: NORD
  native_interval_minutes: 15
  price_column: price_eur_mwh
  missing_price_policy: error

experiment_outputs:
  # Shared by GME, continuous, participation and synthetic studies. Resume takes precedence.
  # With resume disabled, replace existing artifacts for the same run/farm/day scope.
  overwrite_existing: true
  # Native Gurobi per-solve and aggregate timings are always saved in json/optimization_timing.json.
  root: outputs/full_experiments
  run_id: null
  plots: true
  save_model_files: false
  save_dispatch_plans: true
  save_kpis: true
outputs:
  root: outputs/trading
  run_id: null
  plots: true
  save_model_files: false

# GUROBI: relative gap only. Null numerical tolerances defer to Gurobi; study overrides pin tighter values.
solver:
  threads: 10
  time_limit_seconds: 120.0
  mip_gap: 0.0001
  feasibility_tolerance: null
  integrality_tolerance: null
  seed: 17
  output_flag: false

# CONTINUOUS OPTIMIZATION: dates are inclusive local delivery dates in market.timezone.
# First-day auction orders can be submitted on the preceding date.
continuous_optimization:
  # Reuse immutable price workbook snapshots across daily preflight reads.
  price_snapshot_cache_entries: 8
  start_date: null
  end_date: null
  planning_modes:
    - integrated
    - current_auction_only
  perfect_pv_reference: true
  # Solve perfect PV once at DA (or the first available auction) and retain its
  # dispatch and later orders. true restores reoptimization at every active gate.
  perfect_pv_reoptimize_at_each_auction: false
  output_root: outputs/continuous_optimization  # Continuous runs are grouped under farm_<id> here.
  run_id: null
  resume: false
  # Optional raw weather-member scenarios; deterministic forecasts remain causal.
  pv_ensemble:
    enabled: false
    zarr: null
    member_count: null
