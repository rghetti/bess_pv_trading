# STANDARD CONFIGURATION: every experiment imports this file directly.
# Edit shared defaults here; experiment YAMLs contain only their overrides.
# No experiment is launched by loading this file. Dates and source inputs must be set for the chosen command.
schema_version: 1

# January member-wise PV and quantile calibration study. All dates are local delivery days.
pv_online_crps_study:
  output_root: outputs/pv_online_crps
  run_id: january_august_2026
  source_config: configs/pv_experiments/probabilistic_january_august_2026.yaml
  farms: {1: huber_core_03, 345: tcn_weather_02, 901: tcn_weather_01, 910: tcn_core_04}
  auctions: [DA, IDA1, IDA2, IDA3]
  block_hours: 3
  quantiles: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  quantile_alpha: 0.01
  minimum_quantile_days: 7
  workers: 42
  daylight_start: '06:00'
  daylight_end: '21:30'
  seed: 202601

pv_probabilistic_study:
  ensemble_zarr: data/farms/nwp_ens_20260101_20260131.zarr
  dataset_periods: null  # Optional list of {ensemble_zarr, start_day, end_day} delivery windows.
  vintage_strategy: preceding_day  # preceding_day or same_day_retrospective with previous-vintage midnight fill.
  night_target_treatment: zero  # Preserve raw AC; use the approved seasonal physical-study night policy.
  output_root: outputs/pv_probabilistic
  run_id: january_2026_00utc
  farm_ids: [1, 345, 901, 910]
  start_day: '2026-01-01'
  train_end_day: '2026-01-21'
  validation_end_day: null  # Null retains the January study's validation-only evaluation.
  end_day: '2026-01-31'
  calibration_folds:
    - {fit_end: '2026-01-07', predict_start: '2026-01-08', predict_end: '2026-01-14'}
    - {fit_end: '2026-01-14', predict_start: '2026-01-15', predict_end: '2026-01-21'}
  quantiles: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]
  calibration_alpha: 0.01
  workers: 42
  reserved_cpu_cores: 6
  estimated_worker_memory_gb: 2.0
  respect_shared_load: true  # Limit concurrency using the one-minute host load at launch.
  seed: 202601
  max_epochs: 80
  early_stopping_patience: 10
  batch_size: 32
  resume: true
  feature_sets: [core, weather]
  trial_parameters:
    ridge: [{alpha: 0.01}, {alpha: 0.1}, {alpha: 1.0}, {alpha: 10.0}]
    huber: [{alpha: 0.001, epsilon: 1.35}, {alpha: 0.001, epsilon: 1.8}, {alpha: 0.1, epsilon: 1.35}, {alpha: 0.1, epsilon: 1.8}]
    extra_trees: [{min_samples_leaf: 4, max_features: 0.6}, {min_samples_leaf: 4, max_features: 1.0}, {min_samples_leaf: 16, max_features: 0.6}, {min_samples_leaf: 16, max_features: 1.0}]
    hist_gradient_boosting: [{max_leaf_nodes: 7, l2_regularization: 1.0}, {max_leaf_nodes: 7, l2_regularization: 10.0}, {max_leaf_nodes: 31, l2_regularization: 1.0}, {max_leaf_nodes: 31, l2_regularization: 10.0}]
    lightgbm: [{num_leaves: 7, min_child_samples: 20}, {num_leaves: 7, min_child_samples: 80}, {num_leaves: 31, min_child_samples: 20}, {num_leaves: 31, min_child_samples: 80}]
    catboost: [{depth: 4, l2_leaf_reg: 3.0}, {depth: 4, l2_leaf_reg: 10.0}, {depth: 6, l2_leaf_reg: 3.0}, {depth: 6, l2_leaf_reg: 10.0}]
    mlp: [{width: 32, weight_decay: 0.0001}, {width: 32, weight_decay: 0.001}, {width: 64, weight_decay: 0.0001}, {width: 64, weight_decay: 0.001}]
    tcn: [{width: 32, kernel: 3}, {width: 32, kernel: 5}, {width: 64, kernel: 3}, {width: 64, kernel: 5}]
  tree_estimators: 150
  boosting_iterations: 200
  boosting_learning_rate: 0.05

# FARM DATA: measured AC power, weather cycles and static plant metadata. Paths are repository-relative.
inputs:
  zarr: data/farms/pv_farms_timeseries_20250101_20260831.zarr
  metadata_parquet: data/farms/pv_farms_timeseries_20250101_20260831.parquet
source:
  timezone: UTC
  historical_dimensions:
    - time
    - farm_id
  forecast_dimensions:
    - farm_id
    - cycle_time
    - lead_time
  measured_power_basis: AC
  capacity_basis: AC
  historical_interval_minutes: 15
  historical_label: start
  forecast_radiation_label: end
  forecast_radiation_interval_hours: 1
  cycle_cadence_hours: 6
  availability_lag_hours: 6
  explicit_availability_variable: null
  telemetry_latency_minutes: 0
  numeric_lead_units: hours
forecast_mapping:
  forecast_ghi: shortwave_radiation
  forecast_bhi: direct_radiation
  temperature_c: temperature_2m
  dew_point_c: dew_point_2m
  cloud_total_pct: cloud_cover
  cloud_low_pct: cloud_cover_low
  cloud_mid_pct: cloud_cover_mid
  cloud_high_pct: cloud_cover_high
  precipitation_mm: precipitation
  snow_water_equivalent_m: snow_water_equivalent
  visibility_km: visibility
  wind_u_10m: wind_u_component_10m
  wind_v_10m: wind_v_component_10m
  wind_u_100m: wind_u_component_100m
  wind_v_100m: wind_v_component_100m
forecast_semantics:
  forecast_ghi: hourly_mean
  forecast_bhi: hourly_mean
  precipitation_mm: hourly_accumulation
  default: instantaneous
policy:
  version: requested-v1
  plateau:
    enabled: true
    minimum_run: 4
    atol_kw: 0.01
    rtol: 0.0001
    native_minutes: 15
  night:
    enabled: true
    timezone: Europe/Rome
    start: '21:30'
    end: 05:00
  nonnegative_forecasts:
    - forecast_ghi
    - forecast_bhi
    - precipitation_mm
    - snow_water_equivalent_m
    - visibility_km
    - cloud_total_pct
    - cloud_low_pct
    - cloud_mid_pct
    - cloud_high_pct
  interpolation:
    enabled: true
    variables:
      - power
      - ghi
    maximum_gap_hours: null
  evidence_availability: endpoint_and_mask_evidence
review:
  exclusions_csv: null  # Legacy raw-observation review; model-quality exclusions use only pv_data_quality.exclusions_csv.
  excluded_decisions:
    - exclude
    - excluded
    - reject
  mode: exploratory

