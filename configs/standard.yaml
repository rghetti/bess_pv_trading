    ac_capacity_kw: 953.28
    tracking_type_id: 0
    battery:
      capacity_mwh: 0.75
      max_power_mw: 0.5
    pv:
      direct_exceeds_ghi: clip_and_flag
      transposition_model: isotropic
      albedo: 0.2
      bifacial:
        enabled: false
        bifaciality: 0.8
        height_to_pitch_ratio: 0.4
        shade_factor: -0.02
        transmission_factor: 0.0
      output:
        method: calibrated_scale
        calibrated_coefficient: 0.5319403177692952
        assumption_status: global_2025_fit_treated_as_prior_farm_metadata; source=configs/pv_parameters/2025/farm_1.json
  345:
    ac_capacity_kw: 1524.6
    tracking_type_id: 0
    battery:
      capacity_mwh: 1.0
      max_power_mw: 0.5
