  capacity_mwh: auto
  max_power_mw: auto
  soc_min_percent: 7.0
  soc_max_percent: 93.0
  efficiency_convention: combined
  # Symmetric effective AC-to-stored-energy efficiencies: sqrt(0.90) per direction.
  # Their product gives 90% AC-to-AC round-trip efficiency, including conversion losses.
  combined_charge_efficiency: 0.9486832980505138
  combined_discharge_efficiency: 0.9486832980505138
  self_discharge_per_hour: 0.0
  assumption_status: illustrative_not_confirmed_battery_specification
