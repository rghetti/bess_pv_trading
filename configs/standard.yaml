# farms.<id>.pv retains the 2025 output-scale and geometry assumptions as prior metadata.
# Faiman temperature parameters inherit the standard shared pv settings below.
# Override that farm mapping to tune it; pv: null selects the unfitted shared reference below.
# farms.<id>.battery supplies hypothetical capacity/power when the shared battery fields are auto.
# Explicit numeric battery fields in experiment YAMLs override this farm sizing.
farm_id: 910
