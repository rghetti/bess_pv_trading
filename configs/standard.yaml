gme_workbook_import:
  retire_hourly_ida_snapshots: false
terna_workbook_import:
  # Terna 02:01/16/31/46 labels identify the second 02:00/15/30/45 occurrence.
  # Decode only within the actual autumn repeated hour; reject nonexistent spring labels.
  ambiguous_time_policy: second_occurrence_minute_marker
manual_market_import:
  source_directory: data
  stage_directory: data/staging/manual_market
  stage_path: null
  target_database: ${api.database_path}
  duckdb_threads: ${api.database_threads}
  zone: NORD
  timezone: Europe/Rome
  date_start: '2025-01-01'
  # null freezes tomorrow's local midnight when staging; generated import.yaml records it.
  date_end_exclusive: null
  gme_glob: '*_PrezziZonali_Nord.xlsx'
  terna_glob: Riepilogo_Mensile_Quarto_Orario_*.xlsx
  gme_schema_config: configs/api_experiments/gme_workbook_import.yaml
  terna_schema_config: configs/api_experiments/terna_workbook_import.yaml
  terna_ambiguous_time_policy: ${terna_workbook_import.ambiguous_time_policy}
  ida3_start_clock: '12:00'
  audit_delivery_days: ['2025-01-01', '2025-03-30', '2025-03-31', '2025-04-01', '2025-10-01', '2025-10-26', '2026-03-29', '2026-04-01']
  check_report_path: outputs/data_imports/manual_market/postcheck.json
  datasets:
    - {provider: gme, dataset: day_ahead_prices}
    - {provider: gme, dataset: ida1_prices}
    - {provider: gme, dataset: ida2_prices}
    - {provider: gme, dataset: ida3_prices}
    - {provider: terna, dataset: imbalance_prices}

report:
  compile: true

# Optional offline tree benchmark; reuses frozen chronological weather/AC pairs.
pv_ensemble_study:
  source_root: outputs/pv_neural_tuning/neural_hpo_2025_to_2026_08_42cpu
  output_root: outputs/pv_ensembles
  run_id: tracking_ensemble_benchmark  # Also resolves for non-farm/prepared configs.
  focus_month: '2026-01'
  workers: 6  # One CPU thread per fit, no nested parallelism.
  seed: 73021
  feature_sets: [weather, tracker, bifacial]
  models:
    - name: extra_trees_leaf4
      family: extra_trees
      parameters: {n_estimators: 150, min_samples_leaf: 4, max_features: 0.8}
    - name: random_forest_leaf4
      family: random_forest
      parameters: {n_estimators: 150, min_samples_leaf: 4, max_features: 0.8, max_samples: 0.8}
    - name: boosting_leaf15
      family: hist_gradient_boosting
      parameters: {max_iter: 200, max_leaf_nodes: 15, learning_rate: 0.05, l2_regularization: 1.0}
    - name: boosting_leaf31
      family: hist_gradient_boosting
      parameters: {max_iter: 200, max_leaf_nodes: 31, learning_rate: 0.05, l2_regularization: 1.0}

# Broad reproducible forecast HPO: fixed 2025 train / Jan-Apr 2026 validation / May-Aug report.
# No auction identity, proxy geometry/location, physical-model features or elapsed age.
pv_forecast_search:
  farm_ids: [901, 910]
  include_national_holiday: false  # Known Italian national holiday on local delivery date; opt in per study.
  excluded_features: []  # Optional input columns to omit after weather/time features are constructed.
  missing_weather_interpolation: linear_per_view  # Fill each forecast vintage independently before fitting.
  include_missing_indicators: false  # Do not append a separate binary feature for each input column.
  source_root: outputs/pv_neural_tuning/neural_hpo_2025_to_2026_08_42cpu
  output_root: outputs/pv_forecast_search
  run_id: weather_only_901_910_hpo_v1
  resume: true  # Matching config, code, corpus and saved-artifact checksums required.
  workers: 42
  reserved_cpu_cores: 6
  seed: 97231
  feature_sets: [core, weather]
  baseline_ridge_alpha: 1.0  # Fit only to 2025; supplies the residual models' starting curve.
  statistical_trials_per_family: 6
  statistical_spaces:
    boosting_direct:
      max_iter: [150, 300, 500]
      max_leaf_nodes: [7, 15, 31, 63]
      learning_rate: [0.025, 0.05, 0.1]
      l2_regularization: [1.0, 10.0]
      loss: [squared_error, absolute_error]
    boosting_residual:
      max_iter: [150, 300, 500]
      max_leaf_nodes: [7, 15, 31, 63]
      learning_rate: [0.025, 0.05, 0.1]
      l2_regularization: [1.0, 10.0]
      loss: [squared_error, absolute_error]
    spline_direct:
      n_knots: [4, 6, 8]
      degree: [3]
      alpha: [0.1, 1.0, 10.0, 100.0]
    spline_residual:
      n_knots: [4, 6, 8]
      degree: [3]
      alpha: [0.1, 1.0, 10.0, 100.0]
    rbf_direct:
      gamma: [0.005, 0.02, 0.05]
      n_components: [128, 256, 384]
      alpha: [0.1, 1.0, 10.0]
    rbf_residual:
      gamma: [0.005, 0.02, 0.05]
      n_components: [128, 256, 384]
      alpha: [0.1, 1.0, 10.0]
    extra_trees:
      n_estimators: [100, 200]
      max_features: [0.6, 0.8, 1.0]
      min_samples_leaf: [2, 4, 8, 16]
    huber:
      alpha: [0.0001, 0.01, 1.0]
      epsilon: [1.1, 1.35, 1.8]
      max_iter: [500]
  neural_architectures: [residual_mlp, mixture_experts, bigru, transformer]
  neural_trials_per_architecture: 4
  neural_space:
    kernel_size: [3, 5, 7]
    width: [32, 64]
    depth: [2, 3]
    dropout: [0.0, 0.05, 0.15]
    heads: [4]
    experts: [3, 4]
    learning_rate: [0.0003, 0.001, 0.003]
    weight_decay: [0.00001, 0.0001, 0.001]
    loss: [mse, huber]
  neural_training:
    max_epochs: 80
    patience: 10
    minimum_improvement: 0.000001
    batch_size: 32
    huber_delta: 0.05
    gradient_clip_norm: 1.0

# Online gain corrects recent forecast errors using completed, observed days only.
# It does not estimate or assume physical aging. Static weights remain trained to 2025.
pv_online_bias:
  farm_ids: [901, 910]
  source_runs:
    - outputs/pv_forecast_search/weather_only_901_910_hpo_v1
    - outputs/pv_forecast_search/market_free_tcn_901_910_v2
  output_root: outputs/pv_forecast_comparison
  run_id: market_free_901_910_comparison
  base_top_k: 3
  mean_ensemble_sizes: [2, 3, 5]
  bootstrap_block_days: 7
  bootstrap_repetitions: 500
  bootstrap_seed: 89341
  window_days: [7, 14, 30, 60]
  minimum_days: [3, 7]
  gain_bounds: [0.3, 1.5]
  workers: 42

# Optional additive correction by local clock hour from completed production days.
# Frozen reference weights are never refitted; May-August is a reused holdout.
pv_hourly_bias_study:
  farm_ids: [901, 910]
  source_root: outputs/pv_forecast_comparison/market_free_901_910_comparison
  output_root: outputs/pv_hourly_bias
  run_id: original_forecast_901_910
  reference_model: old_selected
  history_start_day: '2026-01-01'  # Avoid in-sample 2025 residuals from the frozen model.
  bucket_hours: 2
  window_days: [7, 14, 30, 60]
  ridge_pseudo_intervals: [10.0, 50.0, 100.0, 250.0]
  minimum_days: 1
  save_plots: true

# Online ridge correction of a frozen PV predictor from completed production days.
# Select feature family, history and shrinkage using validation only. Each
# measured physical quarter enters history once, after all targets are available.
pv_online_ridge_study:
  farm_ids: [901, 910]
  source_root: outputs/pv_forecast_comparison/market_free_901_910_comparison
  output_root: outputs/pv_online_ridge
  run_id: conditional_residual_901_910
  reference_model: old_selected
  secondary_model: selected_including_online
  history_start_day: '2026-01-01'  # Avoid in-sample 2025 residuals.
  families: [offset, gain, irradiance, diurnal, weather_diurnal]
  window_days: [7, 14, 30, 60]
  ridge_pseudo_days: [0.1, 1.0, 5.0, 20.0]
  minimum_days: 3
  save_plots: true

# Prospective monthly refits of each farm's validation-selected statistical model.
# At local midnight on the preceding day, use only completed/available targets.
pv_monthly_retraining:
  farm_ids: [901, 910]
  source_root: outputs/pv_forecast_search/weather_only_901_910_hpo_v1
  comparison_root: outputs/pv_forecast_comparison/market_free_901_910_comparison
  output_root: outputs/pv_monthly_retraining
  run_id: expanding_2026_05_to_08
  report_months: ['2026-05', '2026-06', '2026-07', '2026-08']
  workers: 8  # Eight farm/month fits; each runs on one CPU.
  reserved_cpu_cores: 6
  save_plots: true

# Diagnostics only: satellite GHI and unconfirmed operating flags explain where
# forecast error accumulates. Neither enters an operational PV prediction.
pv_error_diagnostics:
  farm_ids: [901, 910]
  source_root: outputs/pv_forecast_comparison/market_free_901_910_comparison
  output_root: outputs/pv_error_diagnostics
  run_id: frozen_2026_05_to_08
  forecast_model: old_selected
  evaluation_split: test
  ghi_quantile_count: 4
  operating_flags: [suspected_outage, plateau_flag]
  top_flagged_days_for_sensitivity: 1  # Report-only mask; never changes training or forecasts.
  plot_top_flagged_days: 1
  scatter_seed: 13817
  scatter_sample_views: 5000
  save_plots: true
