# Selected hourly DA ExtraTrees rolling evaluation.
include: ../standard.yaml
price_model_search:
  run_id: nord_da_hourly_extra_trees_selected_rolling_v1
  output_root: outputs/energy_price_forecasts
  database: data/api/market_price_features.duckdb
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  timezone: Europe/Rome
  workers: 4
  threads_per_worker: 1
  seed: 17
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  feature_sets:
  - fundamentals
  - curve_fundamentals
  product_groups:
    hourly:
      native_minutes: 60
      history_start: '2024-01-01T00:00:00+01:00'
      history_end: '2025-10-01T00:00:00+02:00'
      cutoff: '2025-07-01T09:00:00Z'
      validation_start: '2025-07-02'
      validation_end: '2025-10-01'
      feature_sets:
      - fundamentals
      - curve_fundamentals
  candidates:
  - id: forest
    family: random_forest
    parameters:
      n_estimators: 150
      min_samples_leaf: 10
      max_features: 0.8
  - id: lightgbm_l1
    family: lightgbm
    parameters:
      n_estimators: 400
      num_leaves: 15
      learning_rate: 0.05
      min_child_samples: 50
      objective: regression_l1
  - id: extra_leaf3_features0.6
    family: extra_trees
    parameters:
      n_estimators: 150
      min_samples_leaf: 3
      max_features: 0.6
  - id: extra_leaf3_features1.0
    family: extra_trees
    parameters:
      n_estimators: 150
      min_samples_leaf: 3
      max_features: 1.0
  - id: extra_leaf15_features0.6
    family: extra_trees
    parameters:
      n_estimators: 150
      min_samples_leaf: 15
      max_features: 0.6
  - id: extra_leaf15_features1.0
    family: extra_trees
    parameters:
      n_estimators: 150
      min_samples_leaf: 15
      max_features: 1.0
  feature_set_aliases:
    curve_price: price_only
    curve_fundamentals: fundamentals
    curve_combined: combined
  daily_curve_lag_days:
  - 1
  - 2
  - 7
  add_daily_curve_features_to:
  - curve_fundamentals
  common_training_rows: true
  selection:
    source_manifest: outputs/energy_price_forecasts/nord_da_extra_trees_resolution_v1/manifest.json
    top_n: 2
    baseline_candidates:
    - forest
    - lightgbm_l1
  rolling_refit:
    frequency_days: 7
    gap_days: 1
