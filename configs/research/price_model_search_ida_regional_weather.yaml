# Matched IDA comparison with regional forecast weather points.
include: ../standard.yaml
price_model_search:
  run_id: nord_ida_2026_regional_weather_matched_v1
  output_root: outputs/energy_price_forecasts
  database: /home/rghetti/bess_pv_trading_features/data/api/market.duckdb
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  timezone: Europe/Rome
  workers: 4
  threads_per_worker: 1
  seed: 17
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  feature_sets:
  - cleared_fundamentals
  - cleared_regional_weather
  product_groups:
    ida1_quarter_hourly:
      target: IDA1
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      market_price_features:
      - DA
      market_neighbor_offsets_minutes:
      - -60
      - -15
    ida2_quarter_hourly:
      target: IDA2
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      market_price_features:
      - DA
      - IDA1
      market_neighbor_offsets_minutes:
      - -60
      - -15
    ida3_quarter_hourly:
      target: IDA3
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      market_price_features:
      - DA
      - IDA1
      - IDA2
      market_neighbor_offsets_minutes:
      - -60
      - -15
      lag_hours:
      - 24
      - 48
      - 72
      - 168
      - 336
  candidates:
  - id: ridge_20
    family: ridge
    parameters:
      alpha: 20.0
  - id: elastic_01
    family: elastic_net
    parameters:
      alpha: 0.1
      l1_ratio: 0.5
      max_iter: 5000
  - id: lasso_1
    family: lasso
    parameters:
      alpha: 1.0
      max_iter: 5000
  - id: hist_l1
    family: hist_gradient_boosting
    parameters:
      max_iter: 250
      max_leaf_nodes: 15
      learning_rate: 0.05
      loss: absolute_error
  - id: lightgbm_l1
    family: lightgbm
    parameters:
      n_estimators: 400
      num_leaves: 15
      learning_rate: 0.05
      min_child_samples: 50
      objective: regression_l1
  - id: catboost_robust
    family: catboost
    parameters:
      iterations: 600
      depth: 6
      learning_rate: 0.03
      loss_function: MAE
      l2_leaf_reg: 10
  feature_set_aliases:
    cleared_fundamentals: fundamentals
    cleared_regional_weather: fundamentals
  add_market_price_features_to:
  - cleared_fundamentals
  - cleared_regional_weather
  residual_target_features: {}
  add_supplemental_features_to:
  - cleared_regional_weather
  supplemental_features:
  - name: regional_milan_temperature_2m
    kind: weather
    provider: open_meteo
    dataset: weather_forecast
    zone: NORD
    expected_unit: °C
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    allow_hindcasts: true
    selectors:
      location_id: milan
      variable: temperature_2m
      source_kind: provider_archive_operational_or_hindcast_unverified
  - name: regional_milan_shortwave_radiation
    kind: weather
    provider: open_meteo
    dataset: weather_forecast
    zone: NORD
    expected_unit: W/m²
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    allow_hindcasts: true
    selectors:
      location_id: milan
      variable: shortwave_radiation
      source_kind: provider_archive_operational_or_hindcast_unverified
    weather_mean_interval_minutes: 60
  - name: regional_turin_temperature_2m
    kind: weather
    provider: open_meteo
    dataset: weather_forecast
    zone: NORD
    expected_unit: °C
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    allow_hindcasts: true
    selectors:
      location_id: turin
      variable: temperature_2m
      source_kind: provider_archive_operational_or_hindcast_unverified
  - name: regional_turin_shortwave_radiation
    kind: weather
    provider: open_meteo
    dataset: weather_forecast
    zone: NORD
    expected_unit: W/m²
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    allow_hindcasts: true
    selectors:
      location_id: turin
      variable: shortwave_radiation
      source_kind: provider_archive_operational_or_hindcast_unverified
    weather_mean_interval_minutes: 60
  - name: regional_verona_temperature_2m
    kind: weather
    provider: open_meteo
    dataset: weather_forecast
    zone: NORD
    expected_unit: °C
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    allow_hindcasts: true
    selectors:
      location_id: verona
      variable: temperature_2m
      source_kind: provider_archive_operational_or_hindcast_unverified
  - name: regional_verona_shortwave_radiation
    kind: weather
    provider: open_meteo
    dataset: weather_forecast
    zone: NORD
    expected_unit: W/m²
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    allow_hindcasts: true
    selectors:
      location_id: verona
      variable: shortwave_radiation
      source_kind: provider_archive_operational_or_hindcast_unverified
    weather_mean_interval_minutes: 60
  - name: regional_venice_temperature_2m
    kind: weather
    provider: open_meteo
    dataset: weather_forecast
    zone: NORD
    expected_unit: °C
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    allow_hindcasts: true
    selectors:
      location_id: venice
      variable: temperature_2m
      source_kind: provider_archive_operational_or_hindcast_unverified
  - name: regional_venice_shortwave_radiation
    kind: weather
    provider: open_meteo
    dataset: weather_forecast
    zone: NORD
    expected_unit: W/m²
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    allow_hindcasts: true
    selectors:
      location_id: venice
      variable: shortwave_radiation
      source_kind: provider_archive_operational_or_hindcast_unverified
    weather_mean_interval_minutes: 60
  common_training_rows: true
