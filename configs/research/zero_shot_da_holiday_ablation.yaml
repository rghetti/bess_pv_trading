include: ../standard.yaml

zero_shot_da_studies:
  root: outputs/da_timesfm_holiday_external
  snapshot: outputs/zero_shot_price_inputs/merged
  base_config: configs/research/zero_shot_da_timesfm_28d.yaml
  feature_search_config: configs/research/price_feature_selection_full_year.yaml
  model_config: configs/research/zero_shot_price_study.yaml
  windows: [28]
  baseline_variants: [history, nord]
  models: [timesfm3]
  cross_border_window: 28
  cross_border_base_variant: nord
  holiday_ablation: true
  cross_border_variants:
    holiday: {directory: holiday, holiday: true, blocks: []}
    holiday_gas: {directory: holiday_gas, holiday: true, blocks: [gas]}
    holiday_france: {directory: holiday_france, holiday: true, blocks: [france]}
    holiday_switzerland: {directory: holiday_switzerland, holiday: true, blocks: [switzerland]}
    holiday_gas_france: {directory: holiday_gas_france, holiday: true, blocks: [gas, france]}
    holiday_gas_switzerland: {directory: holiday_gas_switzerland, holiday: true, blocks: [gas, switzerland]}
    holiday_france_switzerland: {directory: holiday_france_switzerland, holiday: true, blocks: [france, switzerland]}
    holiday_gas_france_switzerland: {directory: holiday_gas_france_switzerland, holiday: true, blocks: [gas, france, switzerland]}
  prepare_workers: 5
  batch_size: 10
  threads_per_model: 1
