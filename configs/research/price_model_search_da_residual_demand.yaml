# Matched DA comparison with residual-demand and generation-margin inputs.
include: ../standard.yaml
price_model_search:
  run_id: nord_da_2026_residual_demand_matched_v1
  output_root: outputs/energy_price_forecasts
  database: /home/rghetti/bess_pv_trading_features/data/api/market.duckdb
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  timezone: Europe/Rome
  workers: 4
  threads_per_worker: 1
  seed: 17
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  feature_sets:
  - curve_fundamentals
  - physical_curve_fundamentals
  - ida_curve_fundamentals
  - physical_ida_curve_fundamentals
  product_groups:
    quarter_hourly:
      native_minutes: 15
      history_start: '2025-10-01T00:00:00+02:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      feature_sets:
      - curve_fundamentals
      - physical_curve_fundamentals
      - ida_curve_fundamentals
      - physical_ida_curve_fundamentals
      lagged_market_price_features:
      - market: IDA1
        lag_hours: 24
      - market: IDA1
        lag_hours: 48
      - market: IDA2
        lag_hours: 24
      - market: IDA2
        lag_hours: 48
  candidates:
  - id: hist_deep
    family: hist_gradient_boosting
    parameters:
      max_iter: 300
      max_leaf_nodes: 31
      learning_rate: 0.05
      l2_regularization: 5.0
  - id: lightgbm_large
    family: lightgbm
    parameters:
      n_estimators: 400
      num_leaves: 31
      learning_rate: 0.05
      min_child_samples: 50
  - id: elastic_05
    family: elastic_net
    parameters:
      alpha: 0.5
      l1_ratio: 0.8
      max_iter: 5000
  - id: hist_l1
    family: hist_gradient_boosting
    parameters:
      max_iter: 250
      max_leaf_nodes: 15
      learning_rate: 0.05
      loss: absolute_error
  - id: lightgbm_l1
    family: lightgbm
    parameters:
      n_estimators: 400
      num_leaves: 15
      learning_rate: 0.05
      min_child_samples: 50
      objective: regression_l1
  - id: catboost_l2
    family: catboost
    parameters:
      iterations: 500
      depth: 5
      learning_rate: 0.04
      loss_function: RMSE
  - id: catboost_robust
    family: catboost
    parameters:
      iterations: 600
      depth: 6
      learning_rate: 0.03
      loss_function: MAE
      l2_leaf_reg: 10
  - id: interaction_ridge_200
    family: interaction_ridge
    parameters:
      lag_count: 11
      alpha: 200.0
  - id: interaction_elastic_0.1
    family: interaction_elastic_net
    parameters:
      lag_count: 11
      alpha: 0.1
      l1_ratio: 0.5
      max_iter: 5000
  feature_set_aliases:
    curve_price: price_only
    curve_fundamentals: fundamentals
    curve_combined: combined
    ida_curve_fundamentals: fundamentals
    ida_curve_combined: combined
    physical_curve_fundamentals: fundamentals
    physical_ida_curve_fundamentals: fundamentals
  daily_curve_lag_days:
  - 1
  - 2
  - 7
  add_daily_curve_features_to:
  - curve_fundamentals
  - physical_curve_fundamentals
  - ida_curve_fundamentals
  - physical_ida_curve_fundamentals
  add_lagged_market_features_to:
  - ida_curve_fundamentals
  - physical_ida_curve_fundamentals
  common_training_rows: true
  add_derived_features_to:
  - physical_curve_fundamentals
  - physical_ida_curve_fundamentals
  derived_features:
  - name: residual_demand_forecast
    weights:
      load_forecast: 1
      solar_forecast: -1
      wind_onshore_forecast: -1
  - name: forecast_generation_margin
    weights:
      generation_forecast: 1
      load_forecast: -1
