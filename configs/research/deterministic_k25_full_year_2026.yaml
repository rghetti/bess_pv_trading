# Portable research settings; supply reviewed model bundles under models/pv.
include: ../standard.yaml
farm_id: 1
forecast:
  curated_realized:
    enabled: true
    dataset_root: data/farms/curated/reviewed_ghi_2025_to_2026_08
continuous_optimization:
  start_date: '2026-01-01'
  end_date: '2026-12-31'
  planning_modes:
  - integrated
  perfect_pv_reference: false
  resume: false
  output_root: outputs/energy_research
  run_id: deterministic_k25_full_year_2026
  pv_ensemble:
    enabled: false
    zarr: null
    member_count: null
    planning_policy: deterministic
state:
  initial_soc_percent: 50.0
  terminal_soc_percent: 50.0
  terminal_soc_min_percent: null
solver:
  threads: 5
  time_limit_seconds: 120.0
  mip_gap: 0.0001
  feasibility_tolerance: 1.0e-08
  integrality_tolerance: 1.0e-08
pv:
  direct_exceeds_ghi: clip_and_flag
  forecast_replacement:
    enabled: true
    allow_retrospective_artifacts: true
    models_by_farm:
      '1':
        name: four_cycle_bigru_extended_037
        kind: reviewed_hpo
        artifact_path: models/pv/reviewed_four_cycle_2026_selected/farm_1/result.json
        available_at_utc: '2026-11-09T00:00:00Z'
      '345':
        name: four_cycle_bigru_core_025
        kind: reviewed_hpo
        artifact_path: models/pv/reviewed_four_cycle_2026_selected/farm_345/result.json
        available_at_utc: '2026-11-09T00:00:00Z'
      '901':
        name: four_cycle_tcn_extended_021
        kind: reviewed_hpo
        artifact_path: models/pv/reviewed_four_cycle_2026_selected/farm_901/result.json
        available_at_utc: '2026-11-09T00:00:00Z'
      '910':
        name: four_cycle_tcn_core_029
        kind: reviewed_hpo
        artifact_path: models/pv/reviewed_four_cycle_2026_selected/farm_910/result.json
        available_at_utc: '2026-11-09T00:00:00Z'
trading:
  optimize_imbalances: false
execution:
  dispatch_policy: deterministic_mpc
  infeasible_auction_policy: previous_plan
  save_infeasibility_diagnostics: true
  mpc_curtailment_recovery: false
settlement:
  enabled: true
experiment_outputs:
  overwrite_existing: false
  plots: true
  save_model_files: false
realtime_mpc_outputs:
  horizon_history: daily_parquet
realtime_mpc:
  current_pv_information: realized_interval_average
  planning_imbalance_penalty_eur_per_mwh: 500.0
  economic_imbalance_penalty_eur_per_mwh: 0.0
  terminal_inventory_mode: soft_target
  terminal_soc_target_percent: 50.0
  terminal_inventory_penalty_eur_per_mwh: 50.0
  solver_time_limit_seconds: 10.0
  oracle_stage2_time_limit_seconds: 10.0
  ensemble_include_deterministic_member: true
  recourse_stages: null
  recourse_observation_lag_intervals: 1
  recourse_pv_bin_width_mw: 0.0
  recourse_observation_features: pv
  monetary_cvar_alpha: 0.9
  monetary_cvar_weight: 0.0
  provisional_ida3_mode: ida2_plan
  recourse_mode: observed_history
  planning_objective: imbalance_and_costs
  first_interval_priority: none
  first_interval_weight: 1.0
gme_oracle_experiment:
  study_id: null
  delivery_day: null
  timezone: Europe/Rome
  price_database: data/api/market.duckdb
  provider: gme
  zone: NORD
  auction_datasets:
    DA:
      dataset: day_ahead_prices
      native_interval_minutes: null
    IDA1:
      dataset: ida1_prices
      native_interval_minutes: 15
    IDA2:
      dataset: ida2_prices
      native_interval_minutes: 15
    IDA3:
      dataset: ida3_prices
      native_interval_minutes: 15
  missing_auction_policy: skip_if_no_products_fail_if_partial
  price_information: perfect_foresight_actual_clearing_curves
  auction_planning_mode: integrated
  decision_resolution_minutes: 15
  price_display_resolution_minutes: 15
  participating_auctions:
  - DA
  - IDA1
  - IDA2
  - IDA3
realtime_mpc_comparison:
  mode: continuous
  controllers:
  - track_committed_grid
  - deterministic_mpc
  frozen_source: null
  check_only: false
  representative_days: 2
energy_price_forecast:
  auction_enabled: false
  settlement_enabled: false
  artifacts: {}
  seed: 17
research_information:
  pv_updates: latest
  price_updates: latest
energy_research_study:
  run_id: deterministic_k25_full_year_2026
  output_root: outputs/energy_research
  mode: continuous
  farms:
  - 1
  - 345
  workers: 1
  native_threads: 1
  solver_threads: 5
  reporting:
    plots: true
    block_days: 7
    samples: 2000
    seed: 17
    confidence: 0.95
    cvar_alpha: 0.9
  windows:
  - id: full_year
    start_date: '2026-01-01'
    end_date: '2026-12-31'
    role: retrospective_full_year
    overrides: {}
  cases:
  - id: deterministic_original
    family: controller
    baseline_case: null
    overrides:
      realtime_mpc:
        first_interval_priority: none
        first_interval_weight: 1.0
  - id: deterministic_weighted_k25
    family: controller
    baseline_case: deterministic_original
    overrides:
      realtime_mpc:
        first_interval_priority: weighted
        first_interval_weight: 25.0
realtime_scenarios:
  dependence: raw
  reduce_to: null
