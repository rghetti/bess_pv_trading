# Matched IDA comparison using older imbalance settlement prices.
include: ../standard.yaml
price_model_search:
  run_id: nord_ida_2026_lagged_settlement_matched_v1
  output_root: outputs/energy_price_forecasts
  database: data/api/market_price_features.duckdb
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  timezone: Europe/Rome
  workers: 4
  threads_per_worker: 1
  seed: 17
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  feature_sets:
  - cleared_fundamentals
  - cleared_settlement
  product_groups:
    ida1_quarter_hourly:
      target: IDA1
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      market_price_features:
      - DA
      market_neighbor_offsets_minutes:
      - -60
      - -15
      lagged_market_price_features:
      - market: settlement
        lag_hours: 72
      - market: settlement
        lag_hours: 168
    ida2_quarter_hourly:
      target: IDA2
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      market_price_features:
      - DA
      - IDA1
      market_neighbor_offsets_minutes:
      - -60
      - -15
      lagged_market_price_features:
      - market: settlement
        lag_hours: 72
      - market: settlement
        lag_hours: 168
    ida3_quarter_hourly:
      target: IDA3
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      market_price_features:
      - DA
      - IDA1
      - IDA2
      market_neighbor_offsets_minutes:
      - -60
      - -15
      lag_hours:
      - 24
      - 48
      - 72
      - 168
      - 336
      lagged_market_price_features:
      - market: settlement
        lag_hours: 72
      - market: settlement
        lag_hours: 168
  candidates:
  - id: ridge_20
    family: ridge
    parameters:
      alpha: 20.0
  - id: elastic_01
    family: elastic_net
    parameters:
      alpha: 0.1
      l1_ratio: 0.5
      max_iter: 5000
  - id: lasso_1
    family: lasso
    parameters:
      alpha: 1.0
      max_iter: 5000
  - id: hist_l1
    family: hist_gradient_boosting
    parameters:
      max_iter: 250
      max_leaf_nodes: 15
      learning_rate: 0.05
      loss: absolute_error
  - id: lightgbm_l1
    family: lightgbm
    parameters:
      n_estimators: 400
      num_leaves: 15
      learning_rate: 0.05
      min_child_samples: 50
      objective: regression_l1
  - id: catboost_robust
    family: catboost
    parameters:
      iterations: 600
      depth: 6
      learning_rate: 0.03
      loss_function: MAE
      l2_leaf_reg: 10
  feature_set_aliases:
    cleared_fundamentals: fundamentals
    cleared_settlement: fundamentals
  add_market_price_features_to:
  - cleared_fundamentals
  - cleared_settlement
  residual_target_features: {}
  add_lagged_market_features_to:
  - cleared_settlement
  common_training_rows: true
