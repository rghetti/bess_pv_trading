# Matched replay of the early-selected recency-weighted DA models.
include: ../standard.yaml
price_model_search:
  add_daily_curve_features_to:
  - curve_price
  - curve_price_weather
  - ida_curve_price
  - ida_curve_price_weather
  add_lagged_market_features_to:
  - ida_curve_price
  - ida_curve_price_weather
  add_supplemental_features_to:
  - curve_price_weather
  - ida_curve_price_weather
  candidates:
  - id: interaction_elastic_net_0.1
    family: interaction_elastic_net
    parameters:
      lag_count: 11
      alpha: 0.1
      l1_ratio: 0.5
      max_iter: 5000
  - id: recency_interaction_2880
    family: recency_interaction_elastic_net
    parameters:
      half_life_observations: 2880
      lag_count: 11
      alpha: 0.1
      l1_ratio: 0.5
      max_iter: 5000
  - id: recency_interaction_8640
    family: recency_interaction_elastic_net
    parameters:
      half_life_observations: 8640
      lag_count: 11
      alpha: 0.1
      l1_ratio: 0.5
      max_iter: 5000
  - id: recency_interaction_17280
    family: recency_interaction_elastic_net
    parameters:
      half_life_observations: 17280
      lag_count: 11
      alpha: 0.1
      l1_ratio: 0.5
      max_iter: 5000
  common_training_rows: true
  daily_curve_lag_days:
  - 1
  - 2
  - 7
  database: data/api/market_with_regional_weather_sep_oct_2026.duckdb
  feature_set_aliases:
    curve_price: price_only
    curve_price_weather: price_only
    ida_curve_price: price_only
    ida_curve_price_weather: price_only
  feature_sets:
  - curve_price
  - curve_price_weather
  - ida_curve_price
  - ida_curve_price_weather
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  output_root: outputs/energy_price_forecasts
  product_groups:
    quarter_hourly:
      cutoff: '2026-08-31T09:00:00Z'
      feature_sets:
      - curve_price
      - curve_price_weather
      - ida_curve_price
      - ida_curve_price_weather
      history_end: '2026-11-01T00:00:00+01:00'
      history_start: '2025-10-01T00:00:00+02:00'
      lagged_market_price_features:
      - lag_hours: 24
        market: IDA1
      - lag_hours: 48
        market: IDA1
      - lag_hours: 24
        market: IDA2
      - lag_hours: 48
        market: IDA2
      native_minutes: 15
      validation_end: '2026-11-01'
      validation_start: '2026-09-01'
  run_id: nord_da_2026_recency_weighted_sep_oct_rolling_v1
  seed: 17
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  supplemental_features:
  - allow_hindcasts: true
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    dataset: weather_forecast
    expected_unit: °C
    kind: weather
    name: regional_milan_temperature_2m
    provider: open_meteo
    selectors:
      location_id: milan
      source_kind: provider_archive_operational_or_hindcast_unverified
      variable: temperature_2m
    zone: NORD
  - allow_hindcasts: true
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    dataset: weather_forecast
    expected_unit: W/m²
    kind: weather
    name: regional_milan_shortwave_radiation
    provider: open_meteo
    selectors:
      location_id: milan
      source_kind: provider_archive_operational_or_hindcast_unverified
      variable: shortwave_radiation
    weather_mean_interval_minutes: 60
    zone: NORD
  - allow_hindcasts: true
