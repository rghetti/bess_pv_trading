        reg_lambda: 20
    - id: mlp_regularized
      family: mlp
      parameters:
        hidden_layer_sizes:
        - 64
        - 32
        alpha: 1.0
        max_iter: 400
        early_stopping: true
        validation_fraction: 0.15
        n_iter_no_change: 15
  - id: ida3_weather
    matrix: outputs/energy_price_forecasts/nord_ida_2026_bidirectional_latest_spread_early_v1/ida3_quarter_hourly__spread_price_weather.npz
    anchor_reference: outputs/energy_price_forecasts/nord_ida_2026_bidirectional_latest_spread_early_v1/ida3_quarter_hourly__spread_price_weather__zero_spread.csv
    anchor_index: 14
