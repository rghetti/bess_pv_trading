# Target-scaled robust regression with convergence diagnostics.
include: ../standard.yaml
price_model_search:
  run_id: nord_ida_2026_huber_search_scaled_v2
  output_root: outputs/energy_price_forecasts
  database: data/api/market_price_features.duckdb
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  timezone: Europe/Rome
  workers: 4
  threads_per_worker: 1
  seed: 17
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  feature_sets:
  - price_only
  - cleared_only
  - cleared_fundamentals
  - cleared_combined
  - spread_cleared_fundamentals
  - spread_cleared_combined
  product_groups:
    ida1_quarter_hourly:
      target: IDA1
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      market_price_features:
      - DA
      market_neighbor_offsets_minutes:
      - -60
      - -15
    ida2_quarter_hourly:
      target: IDA2
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      market_price_features:
      - DA
      - IDA1
      market_neighbor_offsets_minutes:
      - -60
      - -15
    ida3_quarter_hourly:
      target: IDA3
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      market_price_features:
      - DA
      - IDA1
      - IDA2
      market_neighbor_offsets_minutes:
      - -60
      - -15
      lag_hours:
      - 24
      - 48
      - 72
      - 168
      - 336
  candidates:
  - id: ridge_20
    family: ridge
    parameters:
      alpha: 20.0
  - id: lasso_1
    family: lasso
    parameters:
      alpha: 1.0
      max_iter: 5000
  - id: huber_e1.1_a0.01
    family: huber
    parameters:
      epsilon: 1.1
      alpha: 0.01
      max_iter: 1000
  - id: huber_e1.1_a1.0
    family: huber
    parameters:
      epsilon: 1.1
      alpha: 1.0
      max_iter: 1000
  - id: huber_e1.35_a0.01
    family: huber
    parameters:
      epsilon: 1.35
      alpha: 0.01
      max_iter: 1000
  - id: huber_e1.35_a1.0
    family: huber
    parameters:
      epsilon: 1.35
      alpha: 1.0
      max_iter: 1000
  - id: huber_e1.8_a0.01
    family: huber
    parameters:
      epsilon: 1.8
      alpha: 0.01
      max_iter: 1000
  - id: huber_e1.8_a1.0
    family: huber
    parameters:
      epsilon: 1.8
      alpha: 1.0
      max_iter: 1000
  feature_set_aliases:
    cleared_only: price_only
    cleared_fundamentals: fundamentals
    cleared_combined: combined
    spread_cleared_fundamentals: fundamentals
    spread_cleared_combined: combined
  add_market_price_features_to:
  - cleared_only
  - cleared_fundamentals
  - cleared_combined
  - spread_cleared_fundamentals
  - spread_cleared_combined
  residual_target_features:
    spread_cleared_fundamentals: cleared_da
    spread_cleared_combined: cleared_da
