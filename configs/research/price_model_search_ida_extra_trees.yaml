# Matched ExtraTrees comparison against forest and boosting references.
include: ../standard.yaml
price_model_search:
  run_id: nord_ida_extra_trees_2026_v1
  output_root: outputs/energy_price_forecasts
  database: data/api/market_price_features.duckdb
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  timezone: Europe/Rome
  workers: 4
  threads_per_worker: 1
  seed: 17
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  feature_sets:
  - cleared_fundamentals
  - spread_cleared_fundamentals
  product_groups:
    ida1_quarter_hourly:
      target: IDA1
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      market_price_features:
      - DA
      market_neighbor_offsets_minutes:
      - -60
      - -15
      feature_sets:
      - cleared_fundamentals
      - spread_cleared_fundamentals
    ida2_quarter_hourly:
      target: IDA2
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      market_price_features:
      - DA
      - IDA1
      market_neighbor_offsets_minutes:
      - -60
      - -15
      feature_sets:
      - cleared_fundamentals
      - spread_cleared_fundamentals
    ida3_quarter_hourly:
      target: IDA3
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      market_price_features:
      - DA
      - IDA1
      - IDA2
      market_neighbor_offsets_minutes:
      - -60
      - -15
      lag_hours:
      - 24
      - 48
      - 72
      - 168
      - 336
      feature_sets:
      - cleared_fundamentals
      - spread_cleared_fundamentals
  candidates:
  - id: forest
    family: random_forest
    parameters:
      n_estimators: 150
      min_samples_leaf: 10
      max_features: 0.8
  - id: lightgbm_l1
    family: lightgbm
    parameters:
      n_estimators: 400
      num_leaves: 15
      learning_rate: 0.05
      min_child_samples: 50
      objective: regression_l1
  - id: extra_leaf3_features0.6
    family: extra_trees
    parameters:
      n_estimators: 150
      min_samples_leaf: 3
      max_features: 0.6
  - id: extra_leaf3_features1.0
    family: extra_trees
    parameters:
      n_estimators: 150
      min_samples_leaf: 3
      max_features: 1.0
  - id: extra_leaf15_features0.6
    family: extra_trees
    parameters:
      n_estimators: 150
      min_samples_leaf: 15
      max_features: 0.6
  - id: extra_leaf15_features1.0
    family: extra_trees
    parameters:
      n_estimators: 150
      min_samples_leaf: 15
      max_features: 1.0
  feature_set_aliases:
    cleared_fundamentals: fundamentals
    spread_cleared_fundamentals: fundamentals
  add_market_price_features_to:
  - cleared_fundamentals
  - spread_cleared_fundamentals
  residual_target_features:
    spread_cleared_fundamentals: cleared_da
  common_training_rows: true
