# Chronological two-model DA forecast combination on shared products.
include: ../standard.yaml
two_price_forecasts:
  output_root: outputs/energy_price_forecasts
  run_id: nord_da_2026_cross_model_blend_v1
  timezone: Europe/Rome
  tune_start: '2026-05-03'
  tune_end_exclusive: '2026-07-01'
  test_start: '2026-07-01'
  test_end_exclusive: '2026-09-01'
  first_model_weights: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]
  models:
    - run: outputs/energy_price_forecasts/nord_da_2026_regional_weather_selected_rolling_v1
      prediction_file: quarter_hourly__ida_regional_weather__interaction_elastic_0.1.csv
    - run: outputs/energy_price_forecasts/nord_da_2026_price_weather_interactions_may_aug_v1
      prediction_file: quarter_hourly__curve_price_weather__interaction_elastic_net_0.1.csv
