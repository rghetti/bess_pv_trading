# Retrospective 2026 grid-tracking study; execute only after preflight and approval.
include: ../standard.yaml
farm_id: 1
forecast:
  curated_realized:
    enabled: true
    dataset_root: data/farms/curated/reviewed_ghi_2025_to_2026_08
continuous_optimization:
  start_date: '2026-01-01'
  end_date: '2026-08-31'
  planning_modes: [integrated]
  perfect_pv_reference: false
  resume: false
  output_root: outputs/continuous_optimization/annual_2026_grid_tracking
  run_id: farm_1_reviewed_ghi_previous_v1
  pv_ensemble:
    enabled: false
    planning_policy: deterministic
state:
  initial_soc_percent: 50.0
  terminal_soc_percent: 50.0
  terminal_soc_min_percent: null
solver:
  threads: 9
  time_limit_seconds: 120.0
  mip_gap: 0.0001
  feasibility_tolerance: 1.0e-8
  integrality_tolerance: 1.0e-8
pv:
  direct_exceeds_ghi: clip_and_flag
  forecast_replacement:
    enabled: true
    allow_retrospective_artifacts: true
    models_by_farm:
      '1':
        name: reviewed_ghi_bigru_extended_021
        kind: reviewed_hpo
        artifact_path: models/pv/reviewed_ghi_2026_selected/farm_1/result.json
        available_at_utc: '2026-11-04T03:09:00Z'
trading:
  optimize_imbalances: false
execution:
  dispatch_policy: track_committed_grid
  infeasible_auction_policy: previous_plan
  save_infeasibility_diagnostics: true
settlement:
  enabled: true
experiment_outputs:
  overwrite_existing: false
  plots: true
  save_model_files: false
gme_oracle_experiment:
  timezone: Europe/Rome
  price_database: data/api/market.duckdb
  provider: gme
  zone: NORD
  auction_datasets:
    DA: {dataset: day_ahead_prices, native_interval_minutes: null}
    IDA1: {dataset: ida1_prices, native_interval_minutes: 15}
    IDA2: {dataset: ida2_prices, native_interval_minutes: 15}
    IDA3: {dataset: ida3_prices, native_interval_minutes: 15}
  missing_auction_policy: skip_if_no_products_fail_if_partial
  price_information: perfect_foresight_actual_clearing_curves
  auction_planning_mode: integrated
  decision_resolution_minutes: 15
  price_display_resolution_minutes: 15
  participating_auctions: [DA, IDA1, IDA2, IDA3]
energy_price_forecast:
  auction_enabled: false
  settlement_enabled: false
  artifacts: {}
research_information:
  pv_updates: latest
  price_updates: latest
realtime_mpc_comparison:
  mode: continuous
  controllers: [track_committed_grid]
  frozen_source: null
  check_only: false
  representative_days: 3
market:
  valid_to: '2026-08-31'
