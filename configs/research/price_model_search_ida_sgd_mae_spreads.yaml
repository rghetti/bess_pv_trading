# IDA direct absolute-error linear models with spread targets.
include: ../standard.yaml
price_model_search:
  run_id: nord_ida_2026_sgd_mae_spreads_early_v1
  output_root: outputs/energy_price_forecasts
  database: data/api/market_price_features.duckdb
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  timezone: Europe/Rome
  workers: 6
  threads_per_worker: 1
  seed: 17
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  feature_sets:
  - spread_cleared_only
  - spread_previous_only
  product_groups:
    ida2_quarter_hourly:
      target: IDA2
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      market_price_features:
      - DA
      - IDA1
      market_neighbor_offsets_minutes:
      - -60
      - -15
      feature_sets:
      - spread_cleared_only
      - spread_previous_only
    ida3_quarter_hourly:
      target: IDA3
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      market_price_features:
      - DA
      - IDA1
      - IDA2
      market_neighbor_offsets_minutes:
      - -60
      - -15
      lag_hours:
      - 24
      - 48
      - 72
      - 168
      - 336
      feature_sets:
      - spread_cleared_only
      - spread_previous_only
  candidates:
  - id: ridge_20
    family: ridge
    parameters:
      alpha: 20.0
  - id: elastic_05
    family: elastic_net
    parameters:
      alpha: 0.5
      l1_ratio: 0.8
      max_iter: 5000
  - id: lasso_01
    family: lasso
    parameters:
      alpha: 0.1
      max_iter: 5000
  - id: sgd_mae_l2_0.0001_0.15
    family: sgd_mae
    parameters:
      penalty: l2
      alpha: 0.0001
      l1_ratio: 0.15
      max_iter: 3000
      tol: 0.0001
      average: true
  - id: sgd_mae_l2_0.001_0.15
    family: sgd_mae
    parameters:
      penalty: l2
      alpha: 0.001
      l1_ratio: 0.15
      max_iter: 3000
      tol: 0.0001
      average: true
  - id: sgd_mae_elasticnet_0.0001_0.15
    family: sgd_mae
    parameters:
      penalty: elasticnet
      alpha: 0.0001
      l1_ratio: 0.15
      max_iter: 3000
      tol: 0.0001
      average: true
  - id: sgd_mae_elasticnet_0.0001_0.5
    family: sgd_mae
    parameters:
      penalty: elasticnet
      alpha: 0.0001
      l1_ratio: 0.5
      max_iter: 3000
      tol: 0.0001
      average: true
  feature_set_aliases:
    spread_cleared_only: price_only
    spread_previous_only: price_only
  add_market_price_features_to:
  - spread_cleared_only
  - spread_previous_only
  residual_target_features:
    spread_cleared_only: cleared_da
    spread_previous_only: latest_cleared_auction
  common_training_rows: true
