# Selected latest-auction bidirectional spread candidates and baseline.
include: ../standard.yaml
price_model_search:
  add_market_price_features_to:
  - spread_price
  - spread_price_weather
  add_supplemental_features_to:
  - spread_price_weather
  candidates:
  - family: ridge
    id: ridge_20
    parameters:
      alpha: 20.0
  - family: lasso
    id: lasso_1
    parameters:
      alpha: 1.0
      max_iter: 5000
  - family: elastic_net
    id: elastic_01
    parameters:
      alpha: 0.1
      l1_ratio: 0.5
      max_iter: 5000
  - family: extra_trees
    id: extra_leaf15_features06
    parameters:
      max_features: 0.6
      min_samples_leaf: 15
      n_estimators: 150
  - family: extra_trees
    id: extra_leaf15_features10
    parameters:
      max_features: 1.0
      min_samples_leaf: 15
      n_estimators: 150
  - family: zero_spread
    id: zero_spread
    parameters: {}
  common_training_rows: true
  database: /home/rghetti/bess_pv_trading_features/data/api/market.duckdb
  feature_set_aliases:
    spread_price: price_only
    spread_price_weather: price_only
  feature_sets:
  - spread_price
  - spread_price_weather
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  output_root: outputs/energy_price_forecasts
  product_groups:
    ida1_quarter_hourly:
      cutoff: '2026-05-02T09:00:00Z'
      history_end: '2026-09-01T00:00:00+02:00'
      history_start: '2025-01-01T00:00:00+01:00'
      market_neighbor_boundary: same_product
      market_neighbor_offsets_minutes:
      - -60
      - -15
      - 15
      - 60
      market_price_features:
      - DA
      native_minutes: 15
      target: IDA1
      validation_end: '2026-09-01'
      validation_start: '2026-05-03'
    ida2_quarter_hourly:
      cutoff: '2026-05-02T09:00:00Z'
      history_end: '2026-09-01T00:00:00+02:00'
      history_start: '2025-01-01T00:00:00+01:00'
      market_neighbor_boundary: same_product
      market_neighbor_offsets_minutes:
      - -60
      - -15
      - 15
      - 60
      market_price_features:
      - DA
      - IDA1
      native_minutes: 15
      target: IDA2
      validation_end: '2026-09-01'
      validation_start: '2026-05-03'
    ida3_quarter_hourly:
      cutoff: '2026-05-02T09:00:00Z'
      history_end: '2026-09-01T00:00:00+02:00'
      history_start: '2025-01-01T00:00:00+01:00'
      lag_hours:
      - 24
      - 48
      - 72
      - 168
      - 336
      market_neighbor_boundary: same_product
      market_neighbor_offsets_minutes:
      - -60
      - -15
      - 15
      - 60
      market_price_features:
      - DA
      - IDA1
      - IDA2
      native_minutes: 15
      target: IDA3
      validation_end: '2026-09-01'
      validation_start: '2026-05-03'
  residual_target_features:
    spread_price: latest_cleared_auction
    spread_price_weather: latest_cleared_auction
  run_id: nord_ida_2026_bidirectional_latest_spread_may_aug_v1
  seed: 17
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  supplemental_features:
