# Select on June-August 2025 and evaluate weekly rolling refits in September-November.
include: ../standard.yaml
price_model_search:
  run_id: nord_ida_2025_selected_rolling_holdout_v1
  output_root: outputs/energy_price_forecasts
  database: /home/rghetti/bess_pv_trading_features/data/api/market.duckdb
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  timezone: Europe/Rome
  workers: 4
  threads_per_worker: 1
  seed: 17
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  feature_sets:
  - price_only
  - cleared_only
  - cleared_fundamentals
  - cleared_combined
  - spread_cleared_fundamentals
  - spread_cleared_combined
  product_groups:
    ida1_quarter_hourly:
      target: IDA1
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2025-12-01T00:00:00+01:00'
      cutoff: '2025-09-02T09:00:00Z'
      validation_start: '2025-09-03'
      validation_end: '2025-12-01'
      market_price_features:
      - DA
      market_neighbor_offsets_minutes:
      - -60
      - -15
    ida2_quarter_hourly:
      target: IDA2
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2025-12-01T00:00:00+01:00'
      cutoff: '2025-09-02T09:00:00Z'
      validation_start: '2025-09-03'
      validation_end: '2025-12-01'
      market_price_features:
      - DA
      - IDA1
      market_neighbor_offsets_minutes:
      - -60
      - -15
    ida3_quarter_hourly:
      target: IDA3
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2025-12-01T00:00:00+01:00'
      cutoff: '2025-09-02T09:00:00Z'
      validation_start: '2025-09-03'
      validation_end: '2025-12-01'
      market_price_features:
      - DA
      - IDA1
      - IDA2
      market_neighbor_offsets_minutes:
      - -60
      - -15
      lag_hours:
      - 24
      - 48
      - 72
      - 168
      - 336
  candidates:
  - id: ridge_1
    family: ridge
    parameters:
      alpha: 1.0
  - id: ridge_20
    family: ridge
    parameters:
      alpha: 20.0
  - id: ridge_200
    family: ridge
    parameters:
      alpha: 200.0
  - id: lasso_001
    family: lasso
    parameters:
      alpha: 0.01
      max_iter: 5000
  - id: lasso_01
    family: lasso
    parameters:
      alpha: 0.1
      max_iter: 5000
  - id: elastic_01
    family: elastic_net
    parameters:
      alpha: 0.1
      l1_ratio: 0.5
      max_iter: 5000
  - id: hist_shallow
    family: hist_gradient_boosting
    parameters:
      max_iter: 200
      max_leaf_nodes: 15
      learning_rate: 0.05
      l2_regularization: 5.0
  - id: hist_deep
    family: hist_gradient_boosting
    parameters:
      max_iter: 300
      max_leaf_nodes: 31
      learning_rate: 0.05
      l2_regularization: 5.0
  - id: forest
    family: random_forest
    parameters:
      n_estimators: 150
      min_samples_leaf: 10
      max_features: 0.8
  - id: lightgbm_small
    family: lightgbm
    parameters:
      n_estimators: 250
      num_leaves: 15
      learning_rate: 0.05
      min_child_samples: 30
  - id: lightgbm_large
    family: lightgbm
    parameters:
      n_estimators: 400
      num_leaves: 31
      learning_rate: 0.05
      min_child_samples: 50
  - id: catboost_shallow
    family: catboost
    parameters:
      iterations: 300
      depth: 4
      learning_rate: 0.05
      loss_function: MAE
  - id: catboost_deep
    family: catboost
    parameters:
      iterations: 400
      depth: 6
      learning_rate: 0.05
      loss_function: MAE
  - id: mlp_small
    family: mlp
    parameters:
      hidden_layer_sizes:
      - 64
      - 32
      max_iter: 250
      alpha: 0.001
      early_stopping: false
  - id: mlp_large
    family: mlp
    parameters:
      hidden_layer_sizes:
      - 128
      - 64
      max_iter: 250
      alpha: 0.01
      early_stopping: false
  - id: ridge_002
    family: ridge
    parameters:
      alpha: 0.02
  - id: lasso_1
    family: lasso
    parameters:
      alpha: 1.0
      max_iter: 5000
  - id: elastic_001
    family: elastic_net
    parameters:
      alpha: 0.01
      l1_ratio: 0.5
      max_iter: 5000
  - id: elastic_05
    family: elastic_net
    parameters:
      alpha: 0.5
      l1_ratio: 0.8
      max_iter: 5000
  - id: hist_slow
    family: hist_gradient_boosting
    parameters:
      max_iter: 500
      max_leaf_nodes: 15
      learning_rate: 0.025
      l2_regularization: 10.0
  - id: hist_l1
    family: hist_gradient_boosting
    parameters:
      max_iter: 250
      max_leaf_nodes: 15
      learning_rate: 0.05
      loss: absolute_error
  - id: lightgbm_reg
    family: lightgbm
    parameters:
      n_estimators: 500
      num_leaves: 15
      learning_rate: 0.03
      min_child_samples: 100
      reg_lambda: 5.0
  - id: lightgbm_l1
    family: lightgbm
    parameters:
      n_estimators: 400
      num_leaves: 15
      learning_rate: 0.05
      min_child_samples: 50
      objective: regression_l1
  - id: catboost_l2
    family: catboost
    parameters:
      iterations: 500
      depth: 5
      learning_rate: 0.04
      loss_function: RMSE
  - id: catboost_robust
    family: catboost
    parameters:
      iterations: 600
      depth: 6
      learning_rate: 0.03
      loss_function: MAE
      l2_leaf_reg: 10
  - id: forest_small_leaf
    family: random_forest
    parameters:
      n_estimators: 200
      min_samples_leaf: 3
      max_features: 0.8
  - id: mlp_reg
    family: mlp
    parameters:
      hidden_layer_sizes:
      - 64
      - 32
      max_iter: 300
      alpha: 0.1
      early_stopping: false
  feature_set_aliases:
    cleared_only: price_only
    cleared_fundamentals: fundamentals
    cleared_combined: combined
    spread_cleared_fundamentals: fundamentals
    spread_cleared_combined: combined
  add_market_price_features_to:
  - cleared_only
  - cleared_fundamentals
  - cleared_combined
  - spread_cleared_fundamentals
  - spread_cleared_combined
  residual_target_features:
    spread_cleared_fundamentals: cleared_da
    spread_cleared_combined: cleared_da
  selection:
    source_manifest: outputs/energy_price_forecasts/nord_ida_cleared_context_2025_v1/manifest.json
    top_n: 3
    baseline_candidates:
    - ridge_20
  rolling_refit:
    frequency_days: 7
    gap_days: 1
