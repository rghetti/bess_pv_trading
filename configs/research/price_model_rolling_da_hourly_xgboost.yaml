# Later native hourly DA XGBoost evaluation.
include: ../standard.yaml
price_model_search:
  add_daily_curve_features_to:
  - curve_fundamentals
  candidates:
  - family: xgboost
    id: xgb_l2_depth3_child5
    parameters:
      colsample_bytree: 0.9
      learning_rate: 0.04
      max_depth: 3
      min_child_weight: 5
      n_estimators: 600
      objective: reg:squarederror
      reg_lambda: 10
      subsample: 0.9
      tree_method: hist
  - family: xgboost
    id: xgb_l2_depth3_child40
    parameters:
      colsample_bytree: 0.9
      learning_rate: 0.04
      max_depth: 3
      min_child_weight: 40
      n_estimators: 600
      objective: reg:squarederror
      reg_lambda: 10
      subsample: 0.9
      tree_method: hist
  - family: xgboost
    id: xgb_l2_depth6_child5
    parameters:
      colsample_bytree: 0.9
      learning_rate: 0.04
      max_depth: 6
      min_child_weight: 5
      n_estimators: 600
      objective: reg:squarederror
      reg_lambda: 10
      subsample: 0.9
      tree_method: hist
  - family: xgboost
    id: xgb_l2_depth6_child40
    parameters:
      colsample_bytree: 0.9
      learning_rate: 0.04
      max_depth: 6
      min_child_weight: 40
      n_estimators: 600
      objective: reg:squarederror
      reg_lambda: 10
      subsample: 0.9
      tree_method: hist
  - family: xgboost
    id: xgb_l1_depth3_child5
    parameters:
      colsample_bytree: 0.9
      learning_rate: 0.04
      max_depth: 3
      min_child_weight: 5
      n_estimators: 600
      objective: reg:absoluteerror
      reg_lambda: 10
      subsample: 0.9
      tree_method: hist
  - family: xgboost
    id: xgb_l1_depth3_child40
    parameters:
      colsample_bytree: 0.9
      learning_rate: 0.04
      max_depth: 3
      min_child_weight: 40
      n_estimators: 600
      objective: reg:absoluteerror
      reg_lambda: 10
      subsample: 0.9
      tree_method: hist
  - family: xgboost
    id: xgb_l1_depth6_child5
    parameters:
      colsample_bytree: 0.9
      learning_rate: 0.04
      max_depth: 6
      min_child_weight: 5
      n_estimators: 600
      objective: reg:absoluteerror
      reg_lambda: 10
      subsample: 0.9
      tree_method: hist
  - family: xgboost
    id: xgb_l1_depth6_child40
    parameters:
      colsample_bytree: 0.9
      learning_rate: 0.04
      max_depth: 6
      min_child_weight: 40
      n_estimators: 600
      objective: reg:absoluteerror
      reg_lambda: 10
      subsample: 0.9
      tree_method: hist
  common_training_rows: true
  daily_curve_lag_days:
  - 1
  - 2
  - 7
  database: data/api/market_price_features.duckdb
  feature_set_aliases:
    curve_combined: combined
    curve_fundamentals: fundamentals
    curve_price: price_only
  feature_sets:
  - fundamentals
  - curve_fundamentals
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  output_root: outputs/energy_price_forecasts
  product_groups:
    hourly:
      cutoff: '2025-07-01T09:00:00Z'
      feature_sets:
      - fundamentals
      - curve_fundamentals
      history_end: '2025-10-01T00:00:00+02:00'
      history_start: '2024-01-01T00:00:00+01:00'
      native_minutes: 60
      validation_end: '2025-10-01'
      validation_start: '2025-07-02'
  run_id: nord_da_hourly_2025_xgboost_rolling_v1
  seed: 17
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  threads_per_worker: 1
  timezone: Europe/Rome
  workers: 2
  selection:
    source_manifest: outputs/energy_price_forecasts/nord_da_hourly_2025_xgboost_early_v1/manifest.json
    top_n: 2
    baseline_candidates: []
  rolling_refit:
    frequency_days: 7
    gap_days: 1
