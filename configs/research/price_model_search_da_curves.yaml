# CPU day-ahead search with previous-day hourly price-curve features.
include: ../standard.yaml
price_model_search:
  run_id: nord_da_daily_curves_search_v1
  output_root: outputs/energy_price_forecasts
  database: /home/rghetti/bess_pv_trading_features/data/api/market.duckdb
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  timezone: Europe/Rome
  workers: 6
  threads_per_worker: 1
  seed: 17
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  feature_sets:
  - price_only
  - fundamentals
  - curve_price
  - curve_fundamentals
  product_groups:
    hourly:
      native_minutes: 60
      history_start: '2024-01-01T00:00:00+01:00'
      history_end: '2025-07-01T00:00:00+02:00'
      cutoff: '2024-12-31T10:00:00Z'
      validation_start: '2025-01-01'
      validation_end: '2025-07-01'
    quarter_hourly:
      native_minutes: 15
      history_start: '2025-10-01T00:00:00+02:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      feature_sets:
      - price_only
      - fundamentals
      - curve_price
      - curve_fundamentals
      - curve_combined
  candidates:
  - id: ridge_1
    family: ridge
    parameters:
      alpha: 1.0
  - id: ridge_20
    family: ridge
    parameters:
      alpha: 20.0
  - id: ridge_200
    family: ridge
    parameters:
      alpha: 200.0
  - id: lasso_001
    family: lasso
    parameters:
      alpha: 0.01
      max_iter: 5000
  - id: lasso_01
    family: lasso
    parameters:
      alpha: 0.1
      max_iter: 5000
  - id: elastic_01
    family: elastic_net
    parameters:
      alpha: 0.1
      l1_ratio: 0.5
      max_iter: 5000
  - id: hist_shallow
    family: hist_gradient_boosting
    parameters:
      max_iter: 200
      max_leaf_nodes: 15
      learning_rate: 0.05
      l2_regularization: 5.0
  - id: hist_deep
    family: hist_gradient_boosting
    parameters:
      max_iter: 300
      max_leaf_nodes: 31
      learning_rate: 0.05
      l2_regularization: 5.0
  - id: forest
    family: random_forest
    parameters:
      n_estimators: 150
      min_samples_leaf: 10
      max_features: 0.8
  - id: lightgbm_small
    family: lightgbm
    parameters:
      n_estimators: 250
      num_leaves: 15
      learning_rate: 0.05
      min_child_samples: 30
  - id: lightgbm_large
    family: lightgbm
    parameters:
      n_estimators: 400
      num_leaves: 31
      learning_rate: 0.05
      min_child_samples: 50
  - id: catboost_shallow
    family: catboost
    parameters:
      iterations: 300
      depth: 4
      learning_rate: 0.05
      loss_function: MAE
  - id: catboost_deep
    family: catboost
    parameters:
      iterations: 400
      depth: 6
      learning_rate: 0.05
      loss_function: MAE
  - id: mlp_small
    family: mlp
    parameters:
      hidden_layer_sizes:
      - 64
      - 32
      max_iter: 250
      alpha: 0.001
      early_stopping: false
  - id: mlp_large
    family: mlp
    parameters:
      hidden_layer_sizes:
      - 128
      - 64
      max_iter: 250
      alpha: 0.01
      early_stopping: false
  - id: ridge_002
    family: ridge
    parameters:
      alpha: 0.02
  - id: lasso_1
    family: lasso
    parameters:
      alpha: 1.0
      max_iter: 5000
  - id: elastic_001
    family: elastic_net
    parameters:
      alpha: 0.01
      l1_ratio: 0.5
      max_iter: 5000
  - id: elastic_05
    family: elastic_net
    parameters:
      alpha: 0.5
      l1_ratio: 0.8
      max_iter: 5000
  - id: hist_slow
    family: hist_gradient_boosting
    parameters:
      max_iter: 500
      max_leaf_nodes: 15
      learning_rate: 0.025
      l2_regularization: 10.0
  - id: hist_l1
    family: hist_gradient_boosting
    parameters:
      max_iter: 250
      max_leaf_nodes: 15
      learning_rate: 0.05
      loss: absolute_error
  - id: lightgbm_reg
    family: lightgbm
    parameters:
      n_estimators: 500
      num_leaves: 15
      learning_rate: 0.03
      min_child_samples: 100
      reg_lambda: 5.0
  - id: lightgbm_l1
    family: lightgbm
    parameters:
      n_estimators: 400
      num_leaves: 15
      learning_rate: 0.05
      min_child_samples: 50
      objective: regression_l1
  - id: catboost_l2
    family: catboost
    parameters:
      iterations: 500
      depth: 5
      learning_rate: 0.04
      loss_function: RMSE
  - id: catboost_robust
    family: catboost
    parameters:
      iterations: 600
      depth: 6
      learning_rate: 0.03
      loss_function: MAE
      l2_leaf_reg: 10
  - id: forest_small_leaf
    family: random_forest
    parameters:
      n_estimators: 200
      min_samples_leaf: 3
      max_features: 0.8
  - id: mlp_reg
    family: mlp
    parameters:
      hidden_layer_sizes:
      - 64
      - 32
      max_iter: 300
      alpha: 0.1
      early_stopping: false
  feature_set_aliases:
    curve_price: price_only
    curve_fundamentals: fundamentals
    curve_combined: combined
  daily_curve_lag_days:
  - 1
  - 2
  - 7
  add_daily_curve_features_to:
  - curve_price
  - curve_fundamentals
  - curve_combined
