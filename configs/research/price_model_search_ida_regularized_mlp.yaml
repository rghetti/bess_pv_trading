# CPU MLP search with scaled targets and training-set early stopping.
include: ../standard.yaml
price_model_search:
  run_id: nord_ida_2026_regularized_mlp_v1
  output_root: outputs/energy_price_forecasts
  database: data/api/market_price_features.duckdb
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  timezone: Europe/Rome
  workers: 3
  threads_per_worker: 1
  seed: 17
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  feature_sets:
  - cleared_fundamentals
  - spread_cleared_fundamentals
  product_groups:
    ida1_quarter_hourly:
      target: IDA1
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      market_price_features:
      - DA
      market_neighbor_offsets_minutes:
      - -60
      - -15
      feature_sets:
      - cleared_fundamentals
      - spread_cleared_fundamentals
    ida2_quarter_hourly:
      target: IDA2
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      market_price_features:
      - DA
      - IDA1
      market_neighbor_offsets_minutes:
      - -60
      - -15
      feature_sets:
      - cleared_fundamentals
      - spread_cleared_fundamentals
    ida3_quarter_hourly:
      target: IDA3
      native_minutes: 15
      history_start: '2025-01-01T00:00:00+01:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      market_price_features:
      - DA
      - IDA1
      - IDA2
      market_neighbor_offsets_minutes:
      - -60
      - -15
      lag_hours:
      - 24
      - 48
      - 72
      - 168
      - 336
      feature_sets:
      - cleared_fundamentals
      - spread_cleared_fundamentals
  candidates:
  - id: mlp_32_alpha0.01
    family: mlp
    parameters:
      hidden_layer_sizes:
      - 32
      - 16
      max_iter: 300
      alpha: 0.01
      early_stopping: true
      validation_fraction: 0.15
      n_iter_no_change: 15
      learning_rate_init: 0.001
  - id: mlp_64_alpha0.01
    family: mlp
    parameters:
      hidden_layer_sizes:
      - 64
      - 32
      max_iter: 300
      alpha: 0.01
      early_stopping: true
      validation_fraction: 0.15
      n_iter_no_change: 15
      learning_rate_init: 0.001
  - id: mlp_64_alpha0.1
    family: mlp
    parameters:
      hidden_layer_sizes:
      - 64
      - 32
      max_iter: 300
      alpha: 0.1
      early_stopping: true
      validation_fraction: 0.15
      n_iter_no_change: 15
      learning_rate_init: 0.001
  - id: mlp_128_alpha0.1
    family: mlp
    parameters:
      hidden_layer_sizes:
      - 128
      - 64
      max_iter: 300
      alpha: 0.1
      early_stopping: true
      validation_fraction: 0.15
      n_iter_no_change: 15
      learning_rate_init: 0.001
  feature_set_aliases:
    cleared_fundamentals: fundamentals
    spread_cleared_fundamentals: fundamentals
  add_market_price_features_to:
  - cleared_fundamentals
  - spread_cleared_fundamentals
  residual_target_features:
    spread_cleared_fundamentals: cleared_da
  common_training_rows: true
