    enabled: false
state:
  initial_soc_percent: 50.0
  terminal_soc_percent: 50.0
  terminal_soc_min_percent: null
solver:
  threads: 1
  time_limit_seconds: 120.0
  mip_gap: 0.0001
  feasibility_tolerance: 1.0e-08
  integrality_tolerance: 1.0e-08
pv:
  forecast_replacement:
    enabled: false
  direct_exceeds_ghi: clip_and_flag
trading:
  optimize_imbalances: false
execution:
  dispatch_policy: track_committed_grid
  infeasible_auction_policy: previous_plan
  save_infeasibility_diagnostics: true
settlement:
  enabled: true
experiment_outputs:
  overwrite_existing: false
  plots: false
  save_model_files: false
gme_oracle_experiment:
  study_id: null
  delivery_day: null
  timezone: Europe/Rome
  price_database: data/api/market.duckdb
  provider: gme
  zone: NORD
  auction_datasets:
    DA:
      dataset: day_ahead_prices
      native_interval_minutes: null
    IDA1:
      dataset: ida1_prices
      native_interval_minutes: 15
    IDA2:
      dataset: ida2_prices
      native_interval_minutes: 15
    IDA3:
      dataset: ida3_prices
      native_interval_minutes: 15
  missing_auction_policy: skip_if_no_products_fail_if_partial
  price_information: causal_forecast
  auction_planning_mode: integrated
  decision_resolution_minutes: 15
  price_display_resolution_minutes: 15
  participating_auctions: null
continuous_participation_study:
  enabled: true
  candidate_auctions:
  - DA
  - IDA1
  - IDA2
  - IDA3
  required_auctions:
  - DA
  profiles: null
  plots: true
  sequential_all_auctions_baseline: true
  perfect_pv_baseline: false
