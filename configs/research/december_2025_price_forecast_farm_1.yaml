include: ../standard.yaml
farm_id: 1
farms:
  '1':
    pv:
      location:
        latitude: 45.4642
        longitude: 9.19
        location_status: proxy
        acknowledged: true
      output:
        method: explicit_efficiency
        calibrated_coefficient: null
        assumption_status: unfitted_before_study
forecast:
  curated_realized:
    enabled: true
    dataset_root: data/farms/curated/reviewed_ghi_2025_to_2026_08
continuous_optimization:
  start_date: '2025-12-01'
  end_date: '2025-12-31'
  planning_modes:
  - integrated
  perfect_pv_reference: false
  run_id: december_2025_price_forecast_v1
  resume: false
  output_root: outputs/continuous_optimization/december_2025_price_study
