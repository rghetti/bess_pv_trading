  auction_enabled: true
  settlement_enabled: false
  seed: 17
  artifacts:
    DA: outputs/energy_price_forecasts/extended_2024_training_v2/october_2025/ridge_price_only/DA/model.json
    IDA1: outputs/energy_price_forecasts/extended_2024_training_v2/october_2025/ridge_price_only/IDA1/model.json
    IDA2: outputs/energy_price_forecasts/extended_2024_training_v2/october_2025/ridge_price_only/IDA2/model.json
    IDA3: outputs/energy_price_forecasts/extended_2024_training_v2/october_2025/ridge_price_only/IDA3/model.json
  history_paths:
    DA: outputs/energy_price_forecasts/extended_2024_training_v2/history/DA.parquet
    IDA1: outputs/energy_price_forecasts/extended_2024_training_v2/history/IDA1.parquet
    IDA2: outputs/energy_price_forecasts/extended_2024_training_v2/history/IDA2.parquet
    IDA3: outputs/energy_price_forecasts/extended_2024_training_v2/history/IDA3.parquet
