# Native hourly DA XGBoost selection with 2024 training.
include: ../standard.yaml
price_model_search:
  run_id: nord_da_hourly_2025_xgboost_early_v1
  output_root: outputs/energy_price_forecasts
  database: data/api/market_price_features.duckdb
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  timezone: Europe/Rome
  workers: 8
  threads_per_worker: 1
  seed: 17
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  feature_sets:
  - fundamentals
  - curve_fundamentals
  product_groups:
    hourly:
      native_minutes: 60
      history_start: '2024-01-01T00:00:00+01:00'
      history_end: '2025-07-01T00:00:00+02:00'
      cutoff: '2024-12-31T10:00:00Z'
      validation_start: '2025-01-01'
      validation_end: '2025-07-01'
      feature_sets:
      - fundamentals
      - curve_fundamentals
  candidates:
  - id: xgb_l2_depth3_child5
    family: xgboost
    parameters:
      n_estimators: 600
      max_depth: 3
      min_child_weight: 5
      reg_lambda: 10
      learning_rate: 0.04
      subsample: 0.9
      colsample_bytree: 0.9
      objective: reg:squarederror
      tree_method: hist
  - id: xgb_l2_depth3_child40
    family: xgboost
    parameters:
      n_estimators: 600
      max_depth: 3
      min_child_weight: 40
      reg_lambda: 10
      learning_rate: 0.04
      subsample: 0.9
      colsample_bytree: 0.9
      objective: reg:squarederror
      tree_method: hist
  - id: xgb_l2_depth6_child5
    family: xgboost
    parameters:
      n_estimators: 600
      max_depth: 6
      min_child_weight: 5
      reg_lambda: 10
      learning_rate: 0.04
      subsample: 0.9
      colsample_bytree: 0.9
      objective: reg:squarederror
      tree_method: hist
  - id: xgb_l2_depth6_child40
    family: xgboost
    parameters:
      n_estimators: 600
      max_depth: 6
      min_child_weight: 40
      reg_lambda: 10
      learning_rate: 0.04
      subsample: 0.9
      colsample_bytree: 0.9
      objective: reg:squarederror
      tree_method: hist
  - id: xgb_l1_depth3_child5
    family: xgboost
    parameters:
      n_estimators: 600
      max_depth: 3
      min_child_weight: 5
      reg_lambda: 10
      learning_rate: 0.04
      subsample: 0.9
      colsample_bytree: 0.9
      objective: reg:absoluteerror
      tree_method: hist
  - id: xgb_l1_depth3_child40
    family: xgboost
    parameters:
      n_estimators: 600
      max_depth: 3
      min_child_weight: 40
      reg_lambda: 10
      learning_rate: 0.04
      subsample: 0.9
      colsample_bytree: 0.9
      objective: reg:absoluteerror
      tree_method: hist
  - id: xgb_l1_depth6_child5
    family: xgboost
    parameters:
      n_estimators: 600
      max_depth: 6
      min_child_weight: 5
      reg_lambda: 10
      learning_rate: 0.04
      subsample: 0.9
      colsample_bytree: 0.9
      objective: reg:absoluteerror
      tree_method: hist
  - id: xgb_l1_depth6_child40
    family: xgboost
    parameters:
      n_estimators: 600
      max_depth: 6
      min_child_weight: 40
      reg_lambda: 10
      learning_rate: 0.04
      subsample: 0.9
      colsample_bytree: 0.9
      objective: reg:absoluteerror
      tree_method: hist
  feature_set_aliases:
    curve_price: price_only
    curve_fundamentals: fundamentals
    curve_combined: combined
  daily_curve_lag_days:
  - 1
  - 2
  - 7
  add_daily_curve_features_to:
  - curve_fundamentals
  common_training_rows: true
