  feature_set_aliases:
    curve_price: price_only
    curve_fundamentals: fundamentals
    curve_combined: combined
    ida_curve_fundamentals: fundamentals
    ida_curve_combined: combined
  daily_curve_lag_days:
  - 1
  - 2
  - 7
  add_daily_curve_features_to:
  - curve_fundamentals
  - curve_combined
  - ida_curve_fundamentals
  - ida_curve_combined
  add_lagged_market_features_to:
  - ida_curve_fundamentals
  - ida_curve_combined
  common_training_rows: true
  selection:
    source_manifest: outputs/energy_price_forecasts/nord_da_2026_recent_training_windows_v1/manifest.json
    top_n: 3
    baseline_candidates:
    - interaction_elastic_0.1
    matched_feature_pairs:
    - - curve_fundamentals
      - ida_curve_fundamentals
    - - curve_combined
      - ida_curve_combined
    matched_window_baselines: true
  rolling_refit:
    frequency_days: 7
    gap_days: 1
