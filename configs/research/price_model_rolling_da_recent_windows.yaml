# Later paired evaluation of selected recent and full training windows.
include: ../standard.yaml
price_model_search:
  run_id: nord_da_2026_recent_windows_selected_rolling_v1
  output_root: outputs/energy_price_forecasts
  database: /home/rghetti/bess_pv_trading_features/data/api/market.duckdb
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  timezone: Europe/Rome
  workers: 4
  threads_per_worker: 1
  seed: 17
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  feature_sets:
  - curve_fundamentals
  - curve_combined
  - ida_curve_fundamentals
  - ida_curve_combined
  product_groups:
    quarter_hourly:
      native_minutes: 15
      history_start: '2025-10-01T00:00:00+02:00'
      history_end: '2026-09-01T00:00:00+02:00'
      cutoff: '2026-05-02T09:00:00Z'
      validation_start: '2026-05-03'
      validation_end: '2026-09-01'
      feature_sets:
      - curve_fundamentals
      - curve_combined
      - ida_curve_fundamentals
      - ida_curve_combined
      lagged_market_price_features:
      - market: IDA1
        lag_hours: 24
      - market: IDA1
        lag_hours: 48
      - market: IDA2
        lag_hours: 24
      - market: IDA2
        lag_hours: 48
  candidates:
  - id: elastic_05
    family: elastic_net
    parameters:
      alpha: 0.5
      l1_ratio: 0.8
      max_iter: 5000
  - id: hist_l1
    family: hist_gradient_boosting
    parameters:
      max_iter: 250
      max_leaf_nodes: 15
      learning_rate: 0.05
      loss: absolute_error
  - id: lightgbm_l1
    family: lightgbm
    parameters:
      n_estimators: 400
      num_leaves: 15
      learning_rate: 0.05
      min_child_samples: 50
      objective: regression_l1
  - id: catboost_l2
    family: catboost
    parameters:
      iterations: 500
      depth: 5
      learning_rate: 0.04
      loss_function: RMSE
  - id: interaction_ridge_200
    family: interaction_ridge
    parameters:
      lag_count: 11
      alpha: 200.0
  - id: interaction_elastic_0.1
    family: interaction_elastic_net
    parameters:
      lag_count: 11
      alpha: 0.1
      l1_ratio: 0.5
      max_iter: 5000
  - id: elastic_05_last_30d
    family: elastic_net
    parameters:
      alpha: 0.5
      l1_ratio: 0.8
      max_iter: 5000
    train_window_days: 30
  - id: elastic_05_last_60d
    family: elastic_net
    parameters:
      alpha: 0.5
      l1_ratio: 0.8
      max_iter: 5000
    train_window_days: 60
  - id: elastic_05_last_90d
    family: elastic_net
    parameters:
      alpha: 0.5
      l1_ratio: 0.8
      max_iter: 5000
    train_window_days: 90
  - id: hist_l1_last_30d
    family: hist_gradient_boosting
    parameters:
      max_iter: 250
      max_leaf_nodes: 15
      learning_rate: 0.05
      loss: absolute_error
    train_window_days: 30
  - id: hist_l1_last_60d
    family: hist_gradient_boosting
    parameters:
      max_iter: 250
      max_leaf_nodes: 15
      learning_rate: 0.05
      loss: absolute_error
    train_window_days: 60
  - id: hist_l1_last_90d
    family: hist_gradient_boosting
    parameters:
      max_iter: 250
      max_leaf_nodes: 15
