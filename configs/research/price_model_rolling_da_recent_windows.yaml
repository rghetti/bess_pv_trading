      max_iter: 5000
    train_window_days: 30
  - id: interaction_elastic_0.1_last_60d
    family: interaction_elastic_net
    parameters:
      lag_count: 11
      alpha: 0.1
      l1_ratio: 0.5
      max_iter: 5000
