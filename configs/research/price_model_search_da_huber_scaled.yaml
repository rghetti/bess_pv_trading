# Target-scaled robust regression with convergence diagnostics.
include: ../standard.yaml
price_model_search:
  run_id: nord_da_2026_huber_search_scaled_v2
  output_root: outputs/energy_price_forecasts
  database: data/api/market_price_features.duckdb
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  timezone: Europe/Rome
  workers: 4
  threads_per_worker: 1
  seed: 17
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  feature_sets:
  - curve_fundamentals
  - curve_combined
  - ida_curve_fundamentals
  - ida_curve_combined
  product_groups:
    quarter_hourly:
      native_minutes: 15
      history_start: '2025-10-01T00:00:00+02:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      feature_sets:
      - curve_fundamentals
      - curve_combined
      - ida_curve_fundamentals
      - ida_curve_combined
      lagged_market_price_features:
      - market: IDA1
        lag_hours: 24
      - market: IDA1
        lag_hours: 48
      - market: IDA2
        lag_hours: 24
      - market: IDA2
        lag_hours: 48
  candidates:
  - id: ridge_20
    family: ridge
    parameters:
      alpha: 20.0
  - id: lasso_1
    family: lasso
    parameters:
      alpha: 1.0
      max_iter: 5000
  - id: huber_e1.1_a0.01
    family: huber
    parameters:
      epsilon: 1.1
      alpha: 0.01
      max_iter: 1000
  - id: huber_e1.1_a1.0
    family: huber
    parameters:
      epsilon: 1.1
      alpha: 1.0
      max_iter: 1000
  - id: huber_e1.35_a0.01
    family: huber
    parameters:
      epsilon: 1.35
      alpha: 0.01
      max_iter: 1000
  - id: huber_e1.35_a1.0
    family: huber
    parameters:
      epsilon: 1.35
      alpha: 1.0
      max_iter: 1000
  - id: huber_e1.8_a0.01
    family: huber
    parameters:
      epsilon: 1.8
      alpha: 0.01
      max_iter: 1000
  - id: huber_e1.8_a1.0
    family: huber
    parameters:
      epsilon: 1.8
      alpha: 1.0
      max_iter: 1000
  - id: interaction_huber_e1.1_a0.01
    family: interaction_huber
    parameters:
      epsilon: 1.1
      alpha: 0.01
      max_iter: 1000
      lag_count: 11
  - id: interaction_huber_e1.1_a1.0
    family: interaction_huber
    parameters:
      epsilon: 1.1
      alpha: 1.0
      max_iter: 1000
      lag_count: 11
  - id: interaction_huber_e1.35_a0.01
    family: interaction_huber
    parameters:
      epsilon: 1.35
      alpha: 0.01
      max_iter: 1000
      lag_count: 11
  - id: interaction_huber_e1.35_a1.0
    family: interaction_huber
    parameters:
      epsilon: 1.35
      alpha: 1.0
      max_iter: 1000
      lag_count: 11
  - id: interaction_huber_e1.8_a0.01
    family: interaction_huber
    parameters:
      epsilon: 1.8
      alpha: 0.01
      max_iter: 1000
      lag_count: 11
  - id: interaction_huber_e1.8_a1.0
    family: interaction_huber
    parameters:
      epsilon: 1.8
      alpha: 1.0
      max_iter: 1000
      lag_count: 11
  feature_set_aliases:
    curve_price: price_only
    curve_fundamentals: fundamentals
    curve_combined: combined
    ida_curve_fundamentals: fundamentals
    ida_curve_combined: combined
  daily_curve_lag_days:
  - 1
  - 2
  - 7
  add_daily_curve_features_to:
  - curve_fundamentals
  - curve_combined
  - ida_curve_fundamentals
  - ida_curve_combined
  add_lagged_market_features_to:
  - ida_curve_fundamentals
  - ida_curve_combined
  common_training_rows: true
