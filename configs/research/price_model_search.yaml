# Resolution-specific retrospective day-ahead search; 2026 holdout is not used here.
include: ../standard.yaml
price_model_search:
  run_id: nord_da_resolution_search_v1
  output_root: outputs/energy_price_forecasts
  database: data/api/market_price_features.duckdb
  source_study: outputs/energy_price_forecasts/european_context_ablation_v1
  timezone: Europe/Rome
  workers: 2
  threads_per_worker: 1
  seed: 17
  lag_hours: [24, 48, 72, 168, 336]
  feature_sets: [price_only, fundamentals]
  product_groups:
    hourly:
      native_minutes: 60
      history_start: '2024-01-01T00:00:00+01:00'
      history_end: '2025-07-01T00:00:00+02:00'
      cutoff: '2024-12-31T10:00:00Z'
      validation_start: '2025-01-01'
      validation_end: '2025-07-01'
    quarter_hourly:
      native_minutes: 15
      history_start: '2025-10-01T00:00:00+02:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
  candidates:
  - {id: ridge_1, family: ridge, parameters: {alpha: 1.0}}
  - {id: ridge_20, family: ridge, parameters: {alpha: 20.0}}
  - {id: ridge_200, family: ridge, parameters: {alpha: 200.0}}
  - {id: lasso_001, family: lasso, parameters: {alpha: 0.01, max_iter: 5000}}
  - {id: lasso_01, family: lasso, parameters: {alpha: 0.1, max_iter: 5000}}
  - {id: elastic_01, family: elastic_net, parameters: {alpha: 0.1, l1_ratio: 0.5, max_iter: 5000}}
  - {id: hist_shallow, family: hist_gradient_boosting, parameters: {max_iter: 200, max_leaf_nodes: 15, learning_rate: 0.05, l2_regularization: 5.0}}
  - {id: hist_deep, family: hist_gradient_boosting, parameters: {max_iter: 300, max_leaf_nodes: 31, learning_rate: 0.05, l2_regularization: 5.0}}
  - {id: forest, family: random_forest, parameters: {n_estimators: 150, min_samples_leaf: 10, max_features: 0.8}}
  - {id: lightgbm_small, family: lightgbm, parameters: {n_estimators: 250, num_leaves: 15, learning_rate: 0.05, min_child_samples: 30}}
  - {id: lightgbm_large, family: lightgbm, parameters: {n_estimators: 400, num_leaves: 31, learning_rate: 0.05, min_child_samples: 50}}
  - {id: catboost_shallow, family: catboost, parameters: {iterations: 300, depth: 4, learning_rate: 0.05, loss_function: MAE}}
  - {id: catboost_deep, family: catboost, parameters: {iterations: 400, depth: 6, learning_rate: 0.05, loss_function: MAE}}
  - {id: mlp_small, family: mlp, parameters: {hidden_layer_sizes: [64, 32], max_iter: 250, alpha: 0.001, early_stopping: false}}
  - {id: mlp_large, family: mlp, parameters: {hidden_layer_sizes: [128, 64], max_iter: 250, alpha: 0.01, early_stopping: false}}
