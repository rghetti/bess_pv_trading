# Prepared September-October replay; see the coverage limitation in
# docs/reviews/price_regional_weather_2026.md before running this configuration.
include: ../standard.yaml
price_model_search:
  run_id: nord_da_2026_regional_weather_sep_oct_rolling_v1
  output_root: outputs/energy_price_forecasts
  database: data/api/market_price_features.duckdb
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  timezone: Europe/Rome
  workers: 4
  threads_per_worker: 1
  seed: 17
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  feature_sets:
  - curve_fundamentals
  - regional_weather
  - ida_curve_fundamentals
  - ida_regional_weather
  product_groups:
    quarter_hourly:
      native_minutes: 15
      history_start: '2025-10-01T00:00:00+02:00'
      history_end: '2026-11-01T00:00:00+01:00'
      cutoff: '2026-08-31T09:00:00Z'
      validation_start: '2026-09-01'
      validation_end: '2026-11-01'
      feature_sets:
      - curve_fundamentals
      - regional_weather
      - ida_curve_fundamentals
      - ida_regional_weather
      lagged_market_price_features:
      - market: IDA1
        lag_hours: 24
      - market: IDA1
        lag_hours: 48
      - market: IDA2
        lag_hours: 24
      - market: IDA2
        lag_hours: 48
  candidates:
  - id: hist_deep
    family: hist_gradient_boosting
    parameters:
      max_iter: 300
      max_leaf_nodes: 31
      learning_rate: 0.05
      l2_regularization: 5.0
  - id: lightgbm_large
    family: lightgbm
    parameters:
      n_estimators: 400
      num_leaves: 31
      learning_rate: 0.05
      min_child_samples: 50
  - id: elastic_05
    family: elastic_net
    parameters:
      alpha: 0.5
      l1_ratio: 0.8
      max_iter: 5000
  - id: hist_l1
    family: hist_gradient_boosting
    parameters:
      max_iter: 250
      max_leaf_nodes: 15
      learning_rate: 0.05
      loss: absolute_error
  - id: lightgbm_l1
    family: lightgbm
    parameters:
      n_estimators: 400
      num_leaves: 15
      learning_rate: 0.05
      min_child_samples: 50
      objective: regression_l1
  - id: catboost_l2
    family: catboost
    parameters:
      iterations: 500
      depth: 5
      learning_rate: 0.04
      loss_function: RMSE
  - id: catboost_robust
    family: catboost
    parameters:
      iterations: 600
      depth: 6
      learning_rate: 0.03
      loss_function: MAE
      l2_leaf_reg: 10
  - id: interaction_ridge_200
    family: interaction_ridge
    parameters:
      lag_count: 11
      alpha: 200.0
  - id: interaction_elastic_0.1
    family: interaction_elastic_net
    parameters:
      lag_count: 11
      alpha: 0.1
      l1_ratio: 0.5
      max_iter: 5000
  feature_set_aliases:
    curve_price: price_only
    curve_fundamentals: fundamentals
    curve_combined: combined
    ida_curve_fundamentals: fundamentals
    ida_curve_combined: combined
    regional_weather: fundamentals
    ida_regional_weather: fundamentals
  daily_curve_lag_days:
  - 1
  - 2
  - 7
  add_daily_curve_features_to:
  - curve_fundamentals
  - regional_weather
  - ida_curve_fundamentals
  - ida_regional_weather
  add_lagged_market_features_to:
  - ida_curve_fundamentals
  - ida_regional_weather
  common_training_rows: true
  add_supplemental_features_to:
  - regional_weather
  - ida_regional_weather
  supplemental_features:
  - name: regional_milan_temperature_2m
    kind: weather
    provider: open_meteo
    dataset: weather_forecast
    zone: NORD
    expected_unit: °C
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    allow_hindcasts: true
    selectors:
      location_id: milan
      variable: temperature_2m
      source_kind: provider_archive_operational_or_hindcast_unverified
  - name: regional_milan_shortwave_radiation
    kind: weather
    provider: open_meteo
    dataset: weather_forecast
    zone: NORD
    expected_unit: W/m²
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    allow_hindcasts: true
    selectors:
      location_id: milan
      variable: shortwave_radiation
      source_kind: provider_archive_operational_or_hindcast_unverified
    weather_mean_interval_minutes: 60
  - name: regional_turin_temperature_2m
    kind: weather
    provider: open_meteo
    dataset: weather_forecast
    zone: NORD
    expected_unit: °C
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    allow_hindcasts: true
    selectors:
      location_id: turin
      variable: temperature_2m
      source_kind: provider_archive_operational_or_hindcast_unverified
  - name: regional_turin_shortwave_radiation
    kind: weather
    provider: open_meteo
    dataset: weather_forecast
    zone: NORD
    expected_unit: W/m²
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    allow_hindcasts: true
    selectors:
      location_id: turin
      variable: shortwave_radiation
      source_kind: provider_archive_operational_or_hindcast_unverified
    weather_mean_interval_minutes: 60
  - name: regional_verona_temperature_2m
    kind: weather
    provider: open_meteo
    dataset: weather_forecast
    zone: NORD
    expected_unit: °C
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    allow_hindcasts: true
    selectors:
      location_id: verona
      variable: temperature_2m
      source_kind: provider_archive_operational_or_hindcast_unverified
  - name: regional_verona_shortwave_radiation
    kind: weather
    provider: open_meteo
    dataset: weather_forecast
    zone: NORD
    expected_unit: W/m²
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    allow_hindcasts: true
    selectors:
      location_id: verona
      variable: shortwave_radiation
      source_kind: provider_archive_operational_or_hindcast_unverified
    weather_mean_interval_minutes: 60
  - name: regional_venice_temperature_2m
    kind: weather
    provider: open_meteo
    dataset: weather_forecast
    zone: NORD
    expected_unit: °C
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    allow_hindcasts: true
    selectors:
      location_id: venice
      variable: temperature_2m
      source_kind: provider_archive_operational_or_hindcast_unverified
  - name: regional_venice_shortwave_radiation
    kind: weather
    provider: open_meteo
    dataset: weather_forecast
    zone: NORD
    expected_unit: W/m²
    availability_column: scheduled_available_at
    availability_kind: assumed_forecast_cycle_plus_six_hours
    allow_hindcasts: true
    selectors:
      location_id: venice
      variable: shortwave_radiation
      source_kind: provider_archive_operational_or_hindcast_unverified
    weather_mean_interval_minutes: 60
  selection:
    source_manifest: outputs/energy_price_forecasts/nord_da_2026_regional_weather_matched_v1/manifest.json
    top_n: 3
    baseline_candidates:
    - interaction_ridge_200
    - interaction_elastic_0.1
    matched_feature_pairs:
    - - curve_fundamentals
      - regional_weather
    - - ida_curve_fundamentals
      - ida_regional_weather
  rolling_refit:
    frequency_days: 7
    gap_days: 1
