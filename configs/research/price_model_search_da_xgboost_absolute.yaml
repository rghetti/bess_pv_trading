# CPU XGBoost absolute-error search with price and cleared-market features.
include: ../standard.yaml
price_model_search:
  run_id: nord_da_2026_xgboost_absolute_v1
  output_root: outputs/energy_price_forecasts
  database: data/api/market_price_features.duckdb
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  timezone: Europe/Rome
  workers: 6
  threads_per_worker: 1
  seed: 17
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  feature_sets:
  - curve_fundamentals
  - ida_curve_fundamentals
  product_groups:
    quarter_hourly:
      native_minutes: 15
      history_start: '2025-10-01T00:00:00+02:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      feature_sets:
      - curve_fundamentals
      - ida_curve_fundamentals
      lagged_market_price_features:
      - market: IDA1
        lag_hours: 24
      - market: IDA1
        lag_hours: 48
      - market: IDA2
        lag_hours: 24
      - market: IDA2
        lag_hours: 48
  candidates:
  - id: xgb_l1_depth3_child5_l2_5
    family: xgboost
    parameters:
      n_estimators: 600
      max_depth: 3
      min_child_weight: 5
      reg_lambda: 5
      learning_rate: 0.04
      subsample: 0.9
      colsample_bytree: 0.9
      objective: reg:absoluteerror
      tree_method: hist
  - id: xgb_l1_depth3_child40_l2_20
    family: xgboost
    parameters:
      n_estimators: 600
      max_depth: 3
      min_child_weight: 40
      reg_lambda: 20
      learning_rate: 0.04
      subsample: 0.9
      colsample_bytree: 0.9
      objective: reg:absoluteerror
      tree_method: hist
  - id: xgb_l1_depth6_child5_l2_5
    family: xgboost
    parameters:
      n_estimators: 600
      max_depth: 6
      min_child_weight: 5
      reg_lambda: 5
      learning_rate: 0.04
      subsample: 0.9
      colsample_bytree: 0.9
      objective: reg:absoluteerror
      tree_method: hist
  - id: xgb_l1_depth6_child40_l2_20
    family: xgboost
    parameters:
      n_estimators: 600
      max_depth: 6
      min_child_weight: 40
      reg_lambda: 20
      learning_rate: 0.04
      subsample: 0.9
      colsample_bytree: 0.9
      objective: reg:absoluteerror
      tree_method: hist
  feature_set_aliases:
    curve_price: price_only
    curve_fundamentals: fundamentals
    curve_combined: combined
    ida_curve_fundamentals: fundamentals
    ida_curve_combined: combined
  daily_curve_lag_days:
  - 1
  - 2
  - 7
  add_daily_curve_features_to:
  - curve_fundamentals
  - curve_combined
  - ida_curve_fundamentals
  - ida_curve_combined
  add_lagged_market_features_to:
  - ida_curve_fundamentals
  - ida_curve_combined
  common_training_rows: true
