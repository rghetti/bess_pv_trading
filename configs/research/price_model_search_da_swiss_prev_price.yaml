# Matched DA price curves with and without previous-day Swiss balance.
include: ../standard.yaml
price_model_search:
  run_id: nord_da_2026_swiss_prev_price_early_v1
  output_root: outputs/energy_price_forecasts
  database: data/api/market_price_features.duckdb
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  timezone: Europe/Rome
  workers: 6
  threads_per_worker: 1
  seed: 17
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  feature_sets:
  - curve_price
  - curve_price_swiss
  product_groups:
    quarter_hourly:
      native_minutes: 15
      history_start: '2025-10-01T00:00:00+02:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      feature_sets:
      - curve_price
      - curve_price_swiss
  candidates:
  - id: ridge_20
    family: ridge
    parameters:
      alpha: 20.0
  - id: lasso_1
    family: lasso
    parameters:
      alpha: 1.0
      max_iter: 5000
  - id: elastic_01
    family: elastic_net
    parameters:
      alpha: 0.1
      l1_ratio: 0.5
      max_iter: 5000
  - id: extra_leaf15_features06
    family: extra_trees
    parameters:
      n_estimators: 150
      min_samples_leaf: 15
      max_features: 0.6
  - id: extra_leaf15_features10
    family: extra_trees
    parameters:
      n_estimators: 150
      min_samples_leaf: 15
      max_features: 1.0
  feature_set_aliases:
    curve_price: price_only
    curve_price_swiss: price_only
  daily_curve_lag_days:
  - 1
  - 2
  - 7
  add_daily_curve_features_to:
  - curve_price
  - curve_price_swiss
  common_training_rows: true
  supplemental_features:
  - name: swiss_balance_prev_24h
    provider: swissgrid
    dataset: electricity_balance
    zone: CH
    expected_unit: MW
    target_shift_hours: 24
    publication_local_time: 00:00
    publication_day_offset: 0
  add_supplemental_features_to:
  - curve_price_swiss
