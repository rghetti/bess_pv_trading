# Target-scaled stochastic absolute-error regression with matched DA baselines.
include: ../standard.yaml
price_model_search:
  run_id: nord_da_2026_sgd_mae_search_v1
  output_root: outputs/energy_price_forecasts
  database: data/api/market_price_features.duckdb
  source_study: outputs/energy_price_forecasts/european_context_previous_day_v1
  timezone: Europe/Rome
  workers: 4
  threads_per_worker: 1
  seed: 17
  lag_hours:
  - 24
  - 23
  - 25
  - 48
  - 47
  - 49
  - 72
  - 168
  - 167
  - 169
  - 336
  feature_sets:
  - curve_fundamentals
  - curve_combined
  - ida_curve_fundamentals
  - ida_curve_combined
  product_groups:
    quarter_hourly:
      native_minutes: 15
      history_start: '2025-10-01T00:00:00+02:00'
      history_end: '2026-05-01T00:00:00+02:00'
      cutoff: '2026-01-31T10:00:00Z'
      validation_start: '2026-02-01'
      validation_end: '2026-05-01'
      feature_sets:
      - curve_fundamentals
      - curve_combined
      - ida_curve_fundamentals
      - ida_curve_combined
      lagged_market_price_features:
      - market: IDA1
        lag_hours: 24
      - market: IDA1
        lag_hours: 48
      - market: IDA2
        lag_hours: 24
      - market: IDA2
        lag_hours: 48
  candidates:
  - id: interaction_ridge_200
    family: interaction_ridge
    parameters:
      lag_count: 11
      alpha: 200.0
  - id: interaction_elastic_0.1
    family: interaction_elastic_net
    parameters:
      lag_count: 11
      alpha: 0.1
      l1_ratio: 0.5
      max_iter: 5000
  - id: sgd_mae_a1e-05_full
    family: sgd_mae
    parameters:
      alpha: 1.0e-05
      max_iter: 1000
      tol: 0.0001
      average: true
  - id: sgd_mae_a1e-05_60d
    family: sgd_mae
    parameters:
      alpha: 1.0e-05
      max_iter: 1000
      tol: 0.0001
      average: true
    train_window_days: 60
  - id: sgd_mae_a1e-05_90d
    family: sgd_mae
    parameters:
      alpha: 1.0e-05
      max_iter: 1000
      tol: 0.0001
      average: true
    train_window_days: 90
  - id: sgd_mae_a0.0001_full
    family: sgd_mae
    parameters:
      alpha: 0.0001
      max_iter: 1000
      tol: 0.0001
      average: true
  - id: sgd_mae_a0.0001_60d
    family: sgd_mae
    parameters:
