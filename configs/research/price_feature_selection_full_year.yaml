# Draft full-year study. October is provisional validation; November is held out.
include: ../standard.yaml
price_feature_search:
  # The regular runner cannot merge independently sourced fallback snapshots.
  requires_merged_sources: true
  holiday_feature_config: configs/research/price_holiday_feature_expansion.yaml
  allow_training_without_evaluation_coverage: true
  input_config: configs/research/price_search_inputs_full_year.yaml
  database_path: data/api/market.duckdb
  output_directory: outputs/price_feature_search_full_year_2026_cancellations_v1
  timezone: Europe/Rome
  seed: 20261106
  workers: 5
  trials_per_family: 20
  inner_validation_fraction: 0.2
  inner_min_days: 7
  # Keep 30 September so the requested training period contains the full year.
  embargo_days: 0
  minimum_training_rows: 256
  minimum_inner_rows: 96
  minimum_evaluation_rows: 96
  lag_hours: [24, 23, 25, 48, 47, 49, 72, 168, 167, 169, 336]
  max_lag_age_hours: 336
  cancellation_fallback_days: 14
  daily_curve_lag_days: [1, 2, 7]
  near_auction_offsets_products: [-4, -2, -1, 1, 2, 4]
  past_other_market_lag_hours: [24, 48]
  fixed_holidays: ['01-01', '01-06', '04-25', '05-01', '06-02', '08-15', '11-01', '12-08', '12-25', '12-26']
  easter_holidays: true
  plot_cache_directory: outputs/price_feature_search_matplotlib_cache
  auctions:
    DA: {dataset: day_ahead_prices, decision_time: '11:45', decision_day_offset: -1, publication_time: '12:57', publication_day_offset: -1, delivery_start_hour: 0, delivery_end_hour: 24, earlier_markets: [], past_other_markets: [IDA1, IDA2]}
    IDA1: {dataset: ida1_prices, decision_time: '14:45', decision_day_offset: -1, publication_time: '15:30', publication_day_offset: -1, delivery_start_hour: 0, delivery_end_hour: 24, earlier_markets: [DA], past_other_markets: [DA, IDA2]}
    IDA2: {dataset: ida2_prices, decision_time: '21:45', decision_day_offset: -1, publication_time: '22:30', publication_day_offset: -1, delivery_start_hour: 0, delivery_end_hour: 24, earlier_markets: [DA, IDA1], past_other_markets: [DA, IDA1]}
    IDA3: {dataset: ida3_prices, decision_time: '09:45', decision_day_offset: 0, publication_time: '10:30', publication_day_offset: 0, delivery_start_hour: 12, delivery_end_hour: 24, earlier_markets: [DA, IDA1, IDA2], past_other_markets: [DA, IDA1, IDA2], lag_hours: [24, 48, 72, 168, 336]}
  product_groups:
    da_quarter_hourly: {market: DA, native_minutes: 15, train_start: '2025-10-01', train_end: '2026-10-01', validation_start: '2026-10-01', validation_end: '2026-11-01', test_start: '2026-11-01', test_end: '2026-12-01'}
    ida1_quarter_hourly: {market: IDA1, native_minutes: 15, train_start: '2025-10-01', train_end: '2026-10-01', validation_start: '2026-10-01', validation_end: '2026-11-01', test_start: '2026-11-01', test_end: '2026-12-01'}
    ida2_quarter_hourly: {market: IDA2, native_minutes: 15, train_start: '2025-10-01', train_end: '2026-10-01', validation_start: '2026-10-01', validation_end: '2026-11-01', test_start: '2026-11-01', test_end: '2026-12-01'}
    ida3_quarter_hourly: {market: IDA3, native_minutes: 15, train_start: '2025-10-01', train_end: '2026-10-01', validation_start: '2026-10-01', validation_end: '2026-11-01', test_start: '2026-11-01', test_end: '2026-12-01'}
  cohorts:
    price_only: []
    nord_gas: [nord_forecasts, gas]
    regional_previous_day: [nord_forecasts, gas, france]
    full_history: [nord_forecasts, gas, france, switzerland, realized_flows]
    swiss_commercial_2026: [nord_forecasts, gas, france, switzerland, realized_flows, swiss_commercial]
  feature_blocks:
    nord_forecasts:
      availability: assumed_previous_day
      features:
        - {name: nord_load_forecast, source: nord_forecasts, selectors: {dataset: load_forecast}, column: value}
        - {name: nord_generation_forecast, source: nord_forecasts, selectors: {dataset: generation_forecast}, column: value}
        - {name: nord_solar_forecast, source: nord_forecasts, selectors: {dataset: solar_forecast}, column: value}
        - {name: nord_wind_forecast, source: nord_forecasts, selectors: {dataset: wind_onshore_forecast}, column: value}
    gas:
      availability: assumed_previous_day
      features:
        - {name: psv_previous_day, source: psv_gas, column: value, kind: daily_gas, lag_days: 1}
        - {name: psv_previous_week, source: psv_gas, column: value, kind: daily_gas, lag_days: 7}
    france:
      availability: assumed_previous_day
      features:
        - {name: fr_nuclear_previous_day, source: france_balance, column: generation_components_json, component: nucleaire, lag_hours: 24}
        - {name: fr_hydro_previous_day, source: france_balance, column: generation_components_json, component: hydraulique, lag_hours: 24}
        - {name: fr_italy_commercial_previous_day, source: france_balance, column: source_record, component: ech_comm_italie, lag_hours: 24}
        - {name: fr_balance_previous_day, source: france_balance, column: value, lag_hours: 24}
    switzerland:
      availability: assumed_previous_day
      features:
        - {name: ch_generation_previous_day, source: swiss_energy_statistics, column: generation_mw, lag_hours: 24}
        - {name: ch_consumption_previous_day, source: swiss_energy_statistics, column: consumption_mw, lag_hours: 24}
        - {name: ch_it_physical_previous_day, source: swiss_energy_statistics, column: physical_net_export_it_mw, lag_hours: 24}
        - {name: ch_fr_physical_previous_day, source: swiss_energy_statistics, column: physical_net_export_fr_mw, lag_hours: 24}
        - {name: ch_reservoir_previous_week, source: swiss_reservoirs, selectors: {variable: total_ch_gwh}, column: value, lag_hours: 168}
    realized_flows:
      availability: retrospective_realized
      features:
        - {name: ch_it_physical_same_day, source: swiss_energy_statistics, column: physical_net_export_it_mw}
        - {name: ch_fr_physical_same_day, source: swiss_energy_statistics, column: physical_net_export_fr_mw}
        - {name: ch_generation_same_day, source: swiss_energy_statistics, column: generation_mw}
        - {name: ch_consumption_same_day, source: swiss_energy_statistics, column: consumption_mw}
        - {name: fr_physical_all_borders_same_day, source: france_balance, column: source_record, component: ech_physiques}
        - {name: fr_it_commercial_same_day, source: france_balance, column: source_record, component: ech_comm_italie}
        - {name: fr_ch_commercial_same_day, source: france_balance, column: source_record, component: ech_comm_suisse}
    swiss_commercial:
      availability: retrospective_commercial
      contains_target_da_price: true
      features:
        - {name: ch_it_commercial_same_day, source: swiss_commercial_border, selectors: {variable: schedule_ch_it}, column: value}
        - {name: ch_fr_commercial_same_day, source: swiss_commercial_border, selectors: {variable: schedule_ch_fr}, column: value}
        - {name: it_ch_da_spread_same_day, source: swiss_commercial_border, selectors: {variable: spread_it_nord_ch}, column: value}
        - {name: fr_ch_da_spread_same_day, source: swiss_commercial_border, selectors: {variable: spread_fr_ch}, column: value}
        - {name: ch_it_ntc_same_day, source: swiss_commercial_border, selectors: {variable: ntc_ch_to_it}, column: value}
        - {name: it_ch_ntc_same_day, source: swiss_commercial_border, selectors: {variable: ntc_it_to_ch}, column: value}
        - {name: ch_fr_ntc_same_day, source: swiss_commercial_border, selectors: {variable: ntc_ch_to_fr}, column: value}
        - {name: fr_ch_ntc_same_day, source: swiss_commercial_border, selectors: {variable: ntc_fr_to_ch}, column: value}
  parameter_spaces:
    ridge:
      alpha: {log_uniform: [0.01, 10000]}
    elastic_net:
      alpha: {log_uniform: [0.001, 10]}
      l1_ratio: {choices: [0.1, 0.3, 0.5, 0.7, 0.9, 0.99]}
      max_iter: 10000
    random_forest:
      n_estimators: {choices: [200, 400, 600]}
      min_samples_leaf: {choices: [2, 5, 10, 20, 40]}
      max_depth: {choices: [null, 8, 15, 25]}
      max_features: {choices: [0.4, 0.7, 1.0]}
      criterion: squared_error
    extra_trees:
      n_estimators: {choices: [200, 400, 600]}
      min_samples_leaf: {choices: [2, 5, 10, 20, 40]}
      max_depth: {choices: [null, 8, 15, 25]}
      max_features: {choices: [0.4, 0.7, 1.0]}
      criterion: {choices: [squared_error, absolute_error]}
    hist_gradient_boosting:
      max_iter: {choices: [150, 300, 600]}
      max_leaf_nodes: {choices: [7, 15, 31, 63]}
      max_depth: {choices: [null, 3, 5, 8]}
      learning_rate: {log_uniform: [0.015, 0.15]}
      min_samples_leaf: {choices: [20, 50, 100]}
      l2_regularization: {choices: [0, 0.1, 1, 10, 50]}
      loss: absolute_error
    lightgbm:
      n_estimators: {choices: [250, 500, 900, 1200]}
      num_leaves: {choices: [7, 15, 31, 63]}
      max_depth: {choices: [-1, 4, 6, 8]}
      learning_rate: {log_uniform: [0.01, 0.12]}
      min_child_samples: {choices: [20, 50, 100, 150]}
      subsample: {uniform: [0.65, 1.0]}
      subsample_freq: 1
      colsample_bytree: {uniform: [0.55, 1.0]}
      reg_alpha: {choices: [0, 0.1, 1, 10]}
      reg_lambda: {choices: [0.1, 1, 10, 100]}
      objective: regression_l1
    catboost:
      iterations: {choices: [300, 600, 1000]}
      depth: {choices: [4, 5, 6, 7, 8]}
      learning_rate: {log_uniform: [0.01, 0.12]}
      l2_leaf_reg: {log_uniform: [0.5, 50]}
      loss_function: MAE
    xgboost:
      n_estimators: {choices: [250, 500, 900, 1200]}
      max_depth: {choices: [2, 3, 4, 6, 8]}
      learning_rate: {log_uniform: [0.01, 0.12]}
      min_child_weight: {choices: [1, 5, 10, 30]}
      subsample: {uniform: [0.6, 1.0]}
      colsample_bytree: {uniform: [0.55, 1.0]}
      reg_alpha: {choices: [0, 0.1, 1, 10]}
      reg_lambda: {choices: [0.1, 1, 10, 100]}
      objective: {choices: [reg:absoluteerror, reg:squarederror]}
      tree_method: hist
    mlp:
      hidden_layer_sizes: {choices: [[64], [128], [64, 64], [128, 64], [128, 128]]}
      activation: {choices: [relu, tanh]}
      alpha: {log_uniform: [0.0001, 1]}
      learning_rate_init: {log_uniform: [0.0002, 0.01]}
      batch_size: {choices: [128, 256]}
      max_iter: {choices: [300, 600]}
      early_stopping: false
